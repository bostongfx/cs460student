<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WebGPU Fish Scene</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background: #000 url('https://cs460.org/assignments/04/bg.jpg') center / cover no-repeat;
    }
    #c { display: block; width: 100%; height: 100%; }
    #error {
      display: none; position: fixed; top: 12px; left: 12px; right: 12px;
      background: rgba(120,0,0,.9); color: white; padding: 12px;
      font: 14px sans-serif;
    }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="error" role="alert"></div>

  <script type="module">
    // WebGPU port of the supplied WebGL fish scene.
    // The fish geometry, 101 fish, positions, movement, random rotation,
    // pulsating colors, red-fish mouse movement, and alpha blending are retained.
    // WebGPU uses WGSL shaders, GPU buffers, bind groups and render pipelines.

    const canvas = document.getElementById('c');
    const errorLabel = document.getElementById('error');
    const step_x = 0.01;

    function createFish(offset, color, scale = 1, direction = 1) {
      // Every fish uses the same geometry (uploaded to the GPU once).
      return {
        offset: new Float32Array(offset),
        color: new Float32Array(color),
        scale,
        direction
      };
    }

    function moveFish(fish, r) {
      const offset = fish.offset;
      let direction = fish.direction;
      const scale = fish.scale;

      if (r === 0) {
        // Big red fish: retain original bounded horizontal swimming/wiggle.
        offset[0] += direction * step_x;
        offset[1] += 0.1 * Math.random();
        offset[1] -= 0.1 * Math.random();
        const x_limit = 1 - 0.5 * scale;
        const y_limit = 1 - 0.3 * scale;
        if (offset[0] >= x_limit) {
          offset[0] = x_limit;
          direction = -1;
        } else if (offset[0] <= -x_limit) {
          offset[0] = -x_limit;
          direction = 1;
        }
        offset[1] = Math.max(-y_limit, Math.min(y_limit, offset[1]));
      } else {
        // Small fish: port the original code's horizontal flip/wrap behavior.
        offset[0] += direction * step_x;
        offset[1] += 0.005 * Math.random();
        offset[1] -= 0.005 * Math.random();
        if (offset[0] >= 1) direction = -1;
        offset[0] *= direction;
        offset[0] += direction * 0.01;
        if (offset[0] >= 1) direction = -1;
        else if (offset[0] <= -1) direction = 1;
      }
      fish.direction = direction;
    }

    function getTransform(fish) {
      const offset = fish.offset;
      const scale = fish.scale;
      const direction = fish.direction;
      const theta = (Math.random() * 20 - 5) * Math.PI / 180;
      // Column-major 4x4 transformation, same as gl.uniformMatrix4fv.
      return [
        direction * scale * Math.cos(theta),   scale * Math.sin(theta), 0, 0,
        -direction * scale * Math.sin(theta),  scale * Math.cos(theta), 0, 0,
        0, 0, direction * scale, 0,
        offset[0], offset[1], offset[2], 1
      ];
    }

    const wgsl = /* wgsl */ `
      struct FishUniforms {
        transform: mat4x4<f32>, // bytes 0-63
        color: vec4<f32>,      // bytes 64-79
        eye: vec4<f32>,        // bytes 80-95: (canvas width, height, eye diameter, spare)
      };
      @group(0) @binding(0) var<uniform> fish: FishUniforms;

      // Fish body shader (equivalent to GLSL's gl_Position and gl_FragColor).
      @vertex
      fn vertexMain(@location(0) position: vec3<f32>) -> @builtin(position) vec4<f32> {
        return fish.transform * vec4<f32>(position, 1.0);
      }

      @fragment
      fn fragmentMain() -> @location(0) vec4<f32> {
        return fish.color;
      }

      struct EyeOutput {
        @builtin(position) position: vec4<f32>,
        @location(0) local: vec2<f32>,
      };

      // WebGPU has no configurable gl_PointSize. Draw a 6-vertex quad centered
      // at the same eye point (0.2, 0.2, 0.0), clipping it into a round eye.
      @vertex
      fn eyeVertex(@builtin(vertex_index) vertexIndex: u32) -> EyeOutput {
        let corners = array<vec2<f32>, 6>(
          vec2<f32>(-1.0, -1.0), vec2<f32>( 1.0, -1.0), vec2<f32>(-1.0,  1.0),
          vec2<f32>(-1.0,  1.0), vec2<f32>( 1.0, -1.0), vec2<f32>( 1.0,  1.0)
        );
        let local = corners[vertexIndex];
        let center = fish.transform * vec4<f32>(0.2, 0.2, 0.0, 1.0);
        // Convert the eye diameter in physical pixels to clip-space radius.
        let clipRadius = vec2<f32>(fish.eye.z / fish.eye.x,
                                   fish.eye.z / fish.eye.y);
        var output: EyeOutput;
        output.position = center + vec4<f32>(local * clipRadius * center.w, 0.0, 0.0);
        output.local = local;
        return output;
      }

      @fragment
      fn eyeFragment(input: EyeOutput) -> @location(0) vec4<f32> {
        if (dot(input.local, input.local) > 1.0) {
          discard;
        }
        return vec4<f32>(0.0, 0.0, 0.0, 0.5);
      }
    `;

    async function main() {
      if (!navigator.gpu) {
        throw new Error('WebGPU is unavailable. Use a recent WebGPU-enabled browser on HTTPS or localhost.');
      }
      const adapter = await navigator.gpu.requestAdapter();
      if (!adapter) throw new Error('Unable to obtain a WebGPU adapter.');
      const device = await adapter.requestDevice();
      const context = canvas.getContext('webgpu');
      if (!context) throw new Error('Unable to obtain a WebGPU canvas context.');
      const format = navigator.gpu.getPreferredCanvasFormat();

      function resizeCanvas() {
        const dpr = Math.max(1, window.devicePixelRatio || 1);
        const limit = device.limits.maxTextureDimension2D;
        const w = Math.max(1, Math.min(limit, Math.floor(canvas.clientWidth * dpr)));
        const h = Math.max(1, Math.min(limit, Math.floor(canvas.clientHeight * dpr)));
        if (canvas.width !== w || canvas.height !== h) {
          canvas.width = w;
          canvas.height = h;
        }
        return dpr;
      }
      resizeCanvas();
      // Premultiplied alpha allows the CSS background to show through the water.
      context.configure({ device, format, alphaMode: 'premultiplied' });

      const shaderModule = device.createShaderModule({ code: wgsl });
      const compilation = await shaderModule.getCompilationInfo();
      const shaderErrors = compilation.messages.filter(m => m.type === 'error');
      if (shaderErrors.length) {
        throw new Error(shaderErrors.map(m => `${m.lineNum}: ${m.message}`).join('\n'));
      }

      // WGSL needs a uniform buffer (rather than gl.uniformMatrix4fv/etc.).
      // Explicitly reuse the SAME layout in both pipelines.
      const uniformLayout = device.createBindGroupLayout({
        entries: [{
          binding: 0,
          visibility: GPUShaderStage.VERTEX | GPUShaderStage.FRAGMENT,
          buffer: { type: 'uniform' }
        }]
      });
      const pipelineLayout = device.createPipelineLayout({ bindGroupLayouts: [uniformLayout] });

      const target = {
        format,
        blend: {
          color: { operation: 'add', srcFactor: 'src-alpha', dstFactor: 'one-minus-src-alpha' },
          alpha: { operation: 'add', srcFactor: 'one', dstFactor: 'one-minus-src-alpha' }
        },
        writeMask: GPUColorWrite.ALL
      };

      const fishPipeline = device.createRenderPipeline({
        label: 'Fish body pipeline',
        layout: pipelineLayout,
        vertex: {
          module: shaderModule,
          entryPoint: 'vertexMain',
          buffers: [{
            arrayStride: 3 * Float32Array.BYTES_PER_ELEMENT,
            attributes: [{ shaderLocation: 0, offset: 0, format: 'float32x3' }]
          }]
        },
        fragment: { module: shaderModule, entryPoint: 'fragmentMain', targets: [target] },
        primitive: { topology: 'triangle-list', cullMode: 'none' }
      });

      const eyePipeline = device.createRenderPipeline({
        label: 'Fish eye pipeline',
        layout: pipelineLayout,
        vertex: { module: shaderModule, entryPoint: 'eyeVertex' },
        fragment: { module: shaderModule, entryPoint: 'eyeFragment', targets: [target] },
        primitive: { topology: 'triangle-list', cullMode: 'none' }
      });

      // Same seven vertices / five triangles as the original WebGL fish.
      const vertices = new Float32Array([
         0.5,  0.0,  0.0,
         0.2,  0.25, 0.0,
        -0.2,  0.15, 0.0,
        -0.4,  0.3,  0.0,
        -0.4, -0.3,  0.0,
        -0.2, -0.15, 0.0,
         0.2, -0.25, 0.0
      ]);
      // WebGL allowed Uint8 indices; WebGPU index buffers require uint16/uint32.
      const indices = new Uint16Array([
        0, 1, 6, 1, 2, 6, 2, 5, 6, 2, 3, 5, 3, 4, 5
      ]);

      const vertexBuffer = device.createBuffer({
        label: 'Fish vertices',
        size: vertices.byteLength,
        usage: GPUBufferUsage.VERTEX | GPUBufferUsage.COPY_DST
      });
      device.queue.writeBuffer(vertexBuffer, 0, vertices);

      // GPUBuffer size AND queue.writeBuffer() length must be multiples of 4.
      // 15 uint16 indices are 30 bytes, so pad the upload with one unused uint16.
      const paddedIndices = new Uint16Array(16);
      paddedIndices.set(indices);
      const indexBuffer = device.createBuffer({
        label: 'Fish triangle indices',
        size: paddedIndices.byteLength,
        usage: GPUBufferUsage.INDEX | GPUBufferUsage.COPY_DST
      });
      device.queue.writeBuffer(indexBuffer, 0, paddedIndices);

      const all_fish = [];
      all_fish.push(createFish([0, 0, 0], [1, 0, 0, Math.random()], 1, 1));
      for (let i = 0; i < 100; i++) {
        const random_color = [Math.random(), Math.random(), Math.random(), Math.random()];
        const random_offset = [Math.random() - Math.random(), Math.random() - Math.random(), 0];
        const random_scale = Math.random() * 0.3;
        all_fish.push(createFish(random_offset, random_color, random_scale, 1));
      }

      // One uniform record = 16 transform floats + 4 color + 4 eye parameters
      // = 96 bytes. Each record starts at the GPU-required alignment (often 256).
      const bytesPerFish = 96;
      const alignment = device.limits.minUniformBufferOffsetAlignment;
      const stride = Math.ceil(bytesPerFish / alignment) * alignment;
      const uniformData = new Float32Array((stride / 4) * all_fish.length);
      const uniformBuffer = device.createBuffer({
        label: 'Per-fish transform/color/eye uniforms',
        size: stride * all_fish.length,
        usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST
      });
      const bindGroups = all_fish.map((_, i) => device.createBindGroup({
        layout: uniformLayout,
        entries: [{
          binding: 0,
          resource: { buffer: uniformBuffer, offset: i * stride, size: bytesPerFish }
        }]
      }));

      // The source listens to mousemove, so do the same here: the large fish
      // jumps to the pointer location, then continues its own animation.
      canvas.addEventListener('mousemove', event => {
        const rect = canvas.getBoundingClientRect();
        all_fish[0].offset[0] = ((event.clientX - rect.left) / rect.width) * 2 - 1;
        all_fish[0].offset[1] = 1 - ((event.clientY - rect.top) / rect.height) * 2;
      });

      function animate() {
        const dpr = resizeCanvas();
        const t = performance.now() * 0.001;
        const a = 0.6 + 0.4 * Math.sin(t * 2.0);
        const bodyColor = [
          0.3 + 0.2 * Math.sin(t),
          0.6 + 0.2 * Math.sin(t + 2.0),
          0.9 + 0.1 * Math.sin(t + 4.0), a
        ];

        // Update the same CPU-side motion and 4x4 matrices for each fish.
        for (let r = 0; r < all_fish.length; r++) {
          const fish = all_fish[r];
          moveFish(fish, r);
          const at = (r * stride) / 4;
          uniformData.set(getTransform(fish), at);
          uniformData.set(r === 0 ? [1, 0, 0, 0.7] : bodyColor, at + 16);
          uniformData.set([canvas.width, canvas.height, fish.scale * 20 * dpr, 0], at + 20);
        }
        device.queue.writeBuffer(uniformBuffer, 0, uniformData);

        const encoder = device.createCommandEncoder();
        const pass = encoder.beginRenderPass({
          colorAttachments: [{
            view: context.getCurrentTexture().createView(),
            clearValue: { r: 0, g: 0, b: 0, a: 0 },
            loadOp: 'clear',
            storeOp: 'store'
          }]
        });

        // Keep the original body-then-eye draw order, fish by fish.
        pass.setVertexBuffer(0, vertexBuffer);
        pass.setIndexBuffer(indexBuffer, 'uint16');
        for (let r = 0; r < all_fish.length; r++) {
          pass.setBindGroup(0, bindGroups[r]);
          pass.setPipeline(fishPipeline);
          pass.drawIndexed(indices.length);
          pass.setPipeline(eyePipeline);
          pass.draw(6); // two triangles = a circular eye (gl.POINTS replacement)
        }
        pass.end();
        device.queue.submit([encoder.finish()]);
        requestAnimationFrame(animate);
      }
      requestAnimationFrame(animate);
    }

    main().catch(error => {
      console.error(error);
      errorLabel.textContent = `WebGPU error: ${error.message}`;
      errorLabel.style.display = 'block';
    });
  </script>
</body>
</html>
