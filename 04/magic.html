    <meta content="text/html;charset=utf-8" http-equiv="Content-Type">

    <title>CS460 MegaBonus Fish Aquarium</title>
    <style>
        html,
        body {
            background: #041226 url('https://cs460.org/assignments/04/bg.jpg') no-repeat center center fixed;
            background-size: cover;
            margin: 0;
            padding: 0;
            height: 100%;

        #c {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            display: block;
            z-index: 1;

        /* ---------------- BUBBLE LAYER ---------------- */
        .bubble-layer {
            position: fixed;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
            z-index: 2;
        }

        .bubble {
            position: absolute;
            bottom: -35px;
            left: var(--x);
            width: var(--size);
            height: var(--size);
            border-radius: 50%;
            background: radial-gradient(circle at 35% 30%,
                    rgba(255, 255, 255, 0.85) 0%,
                    rgba(210, 245, 255, 0.45) 30%,
                    rgba(140, 220, 255, 0.15) 60%,
                    rgba(220, 250, 255, 0.6) 100%);
            border: 1px solid rgba(220, 250, 255, 0.7);
            box-shadow: 0 0 8px rgba(180, 240, 255, 0.45), inset 1px 1px 4px rgba(255, 255, 255, 0.8);
            animation: rise var(--duration) linear var(--delay) infinite,
                wobble var(--wobble-dur, 3s) ease-in-out var(--delay) infinite alternate;
        }

        @keyframes rise {
            0% {
                transform: translateY(0) scale(0.8);
                opacity: 0;
            }

            10% {
                opacity: 0.8;
            }

            85% {
                opacity: 0.65;
            }

            100% {
                transform: translateY(-112vh) scale(1.15);
                opacity: 0;
            }
        }

        @keyframes wobble {
            0% {
                margin-left: -8px;
            }

            100% {
                margin-left: 8px;
            }

        /* ---------------- LIGHT EFFECT ---------------- */

            pointer-events: none;

                /* Surface sunlight radiance at top */
                radial-gradient(ellipse 95% 38% at 50% 0%, rgba(215, 250, 255, 0.45), transparent 72%),

                linear-gradient(110deg, transparent 22%, rgba(190, 250, 255, 0.24) 35%, transparent 46%),

        /* ---------------- SOUND BUTTON ---------------- */

        #soundButton.playing {
            border-color: rgba(100, 245, 215, 0.85);
            box-shadow: 0 0 16px rgba(70, 240, 200, 0.4), 0 4px 18px rgba(0, 15, 30, 0.5);
        }

        /* ---------------- HUD & CONTROLS HINT ---------------- */
        #aquariumHud {
            position: fixed;
            top: 18px;
            left: 20px;
            z-index: 10;
            display: flex;
            flex-direction: column;
            gap: 8px;
            pointer-events: none;
        }

        .hud-chip {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 7px 14px;
            font-size: 12.5px;
            color: rgba(225, 245, 255, 0.92);
            background: rgba(4, 24, 46, 0.65);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(150, 225, 255, 0.28);
            border-radius: 20px;
            box-shadow: 0 4px 14px rgba(0, 10, 22, 0.4);
            letter-spacing: 0.2px;
        }

        .hud-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #ff4757;
            box-shadow: 0 0 8px #ff4757;
            display: inline-block;
        }

        .hud-chip kbd {
            background: rgba(255, 255, 255, 0.16);
            border: 1px solid rgba(255, 255, 255, 0.35);
            border-radius: 4px;
            padding: 1px 5px;
            font-size: 11px;
            font-family: inherit;
            color: #ffffff;
        }

        /* ---------------- EDGE IMPACT RIPPLE ---------------- */
        .edge-ripple {
            position: fixed;
            top: 0;
            bottom: 0;
            width: 40px;
            pointer-events: none;
            z-index: 4;
            opacity: 0;
            animation: edgeFlash 0.5s ease-out forwards;
        }

        .edge-ripple.left {
            left: 0;
            background: linear-gradient(to right, rgba(255, 80, 80, 0.4), transparent);
        }

        .edge-ripple.right {
            right: 0;
            background: linear-gradient(to left, rgba(255, 80, 80, 0.4), transparent);
        }

        @keyframes edgeFlash {
            0% {
                opacity: 0.85;
                width: 30px;

            100% {
                opacity: 0;
                width: 110px;
            }

<script type="text/javascript" src="https://cs460.org/js/glmatrix.js"></script>

<script id="vertexshader" type="glsl">
    precision mediump float;

    attribute vec3 a_position;

    uniform mat4 u_transform;
    uniform float u_pointsize;
    uniform float u_time;
    uniform float u_wiggle_freq;
    uniform float u_wiggle_phase;

    varying vec3 v_position;

    void main(void) {
        v_position = a_position;
        gl_PointSize = u_pointsize;

        vec3 pos = a_position;

        // Realistic swimming tail wiggle for fish body
        if (pos.x < 0.1 && u_wiggle_freq > 0.0) {
            float flex = (0.1 - pos.x) * 0.15;
            pos.y += sin(u_time * u_wiggle_freq + u_wiggle_phase) * flex;
        }

        gl_Position = u_transform * vec4(pos, 1.0);
    }
</script>

<script id="fragmentshader" type="glsl">
    precision mediump float;

    uniform vec4 u_color;
    uniform float u_is_eye;
    uniform float u_is_hero;
    uniform float u_time;

    varying vec3 v_position;

    void main(void) {
        if (u_is_eye > 0.5) {
            // Circular glossy fish eye with pupil and glint
            vec2 coord = gl_PointCoord - vec2(0.5);
            float dist = length(coord);
            if (dist > 0.5) {
                discard;
            }

            if (u_is_hero > 0.5) {
                // Hero fish: warm golden iris ring, dark pupil, brilliant glint
                vec4 eyeCol = vec4(1.0, 0.88, 0.35, 1.0);
                if (dist < 0.32) {
                    eyeCol = vec4(0.05, 0.07, 0.1, 1.0);
                }
                float glint = length(coord - vec2(-0.15, -0.15));
                if (glint < 0.12) {
                    eyeCol = vec4(1.0, 1.0, 1.0, 1.0);
                }
                gl_FragColor = eyeCol;
                return;
            }

            // School fish: dark glossy eye with crisp bright glint
            vec4 eyeCol = vec4(0.06, 0.1, 0.16, 0.9);
            float glint = length(coord - vec2(-0.13, -0.13));
            if (glint < 0.2) {
                eyeCol = vec4(1.0, 1.0, 1.0, 1.0);
            }
            gl_FragColor = eyeCol;
            return;
        }

        // Fish Body Rendering with realistic shading and sheen:
        vec4 baseColor = u_color;
        vec3 col = baseColor.rgb;

        // Longitudinal and vertical coordinates
        float dorsal = clamp(smoothstep(-0.3, 0.3, v_position.y), 0.0, 1.0);
        float headToTail = clamp(smoothstep(-0.4, 0.5, v_position.x), 0.0, 1.0);

        if (u_is_hero > 0.5) {
            // Hero fish: rich ruby-crimson with warm vermilion highlight and golden fin tips
            vec3 deepRed = vec3(0.92, 0.08, 0.16);
            vec3 brightVermilion = vec3(1.0, 0.36, 0.15);
            vec3 goldenAccent = vec3(1.0, 0.76, 0.22);

            col = mix(deepRed * 0.88, brightVermilion, dorsal * 0.65 + headToTail * 0.35);

            // Golden tail fin accents
            if (v_position.x < -0.22) {
                float tailEdge = smoothstep(-0.22, -0.4, v_position.x);
                col = mix(col, goldenAccent, tailEdge * 0.65);
            }

            // Dorsal rim sheen
            float rim = dorsal * dorsal * dorsal * 0.22;
            col += vec3(rim, rim * 0.5, 0.0);
        } else {
            // School fish: iridescent aquatic sheen
            float sunSheen = dorsal * dorsal * 0.22;
            col += vec3(sunSheen * 0.25, sunSheen * 0.65, sunSheen);

            float belly = 1.0 - dorsal;
            float bellyGlow = belly * belly * belly * 0.14;
            col += vec3(bellyGlow * 0.2, bellyGlow * 0.4, bellyGlow * 0.5);

            // Shimmering scales
            float shimmer = sin(v_position.x * 12.0 + u_time * 5.0) * 0.06;
            col += vec3(shimmer * 0.2, shimmer * 0.8, shimmer);
        }

        gl_FragColor = vec4(clamp(col, 0.0, 1.0), baseColor.a);
    }
</script>

<script>

    var c, gl;
    var v_shader, f_shader, shaderprogram;
    var all_fish = [];

    var oceanAudioContext = null;
    var oceanIsPlaying = false;
    var lastEdgeToneTime = 0;
    var bubbleSoundTimer = null;

    function toggleOceanSound() {
        var button = document.getElementById("soundButton");

        if (!oceanAudioContext) {
            oceanAudioContext = new (window.AudioContext || window.webkitAudioContext)();
            if (oceanAudioContext.state === "suspended") {
                oceanAudioContext.resume();
            }

            var buffer = oceanAudioContext.createBuffer(
                1,
                oceanAudioContext.sampleRate * 2,
                oceanAudioContext.sampleRate
            );
            var data = buffer.getChannelData(0);

            for (var i = 0; i < data.length; i++) {
                data[i] = (Math.random() * 2 - 1) * 0.25;
            }

            var noise = oceanAudioContext.createBufferSource();
            noise.buffer = buffer;
            noise.loop = true;

            var filter = oceanAudioContext.createBiquadFilter();
            filter.type = "lowpass";
            filter.frequency.value = 350;

            var oceanVolume = oceanAudioContext.createGain();
            oceanVolume.gain.value = 0.025;

            noise.connect(filter);
            filter.connect(oceanVolume);
            oceanVolume.connect(oceanAudioContext.destination);
            noise.start();

            if (bubbleSoundTimer === null) {
                bubbleSoundTimer = setInterval(playBubbleSound, 2800);
            }

            oceanIsPlaying = true;
            button.textContent = "🔇 Mute ocean sound";
            button.classList.add("playing");
            return;
        }

        if (oceanIsPlaying || oceanAudioContext.state === "running") {
            oceanAudioContext.suspend();
            oceanIsPlaying = false;
            button.textContent = "🔊 Start ocean sound";
            button.classList.remove("playing");
        } else {
            oceanAudioContext.resume();
            oceanIsPlaying = true;
            button.textContent = "🔇 Mute ocean sound";
            button.classList.add("playing");
        }
    }

    function playEdgeSound() {
        if (!oceanAudioContext || (!oceanIsPlaying && oceanAudioContext.state !== "running")) return;

        var now = performance.now();
        if (now - lastEdgeToneTime < 150) return;
        lastEdgeToneTime = now;

        var time = oceanAudioContext.currentTime;
        var tone = oceanAudioContext.createOscillator();
        var volume = oceanAudioContext.createGain();

        tone.type = "sine";
        tone.frequency.setValueAtTime(520, time);
        tone.frequency.exponentialRampToValueAtTime(260, time + 0.14);

        volume.gain.setValueAtTime(0.08, time);
        volume.gain.exponentialRampToValueAtTime(0.001, time + 0.14);

        tone.connect(volume);
        volume.connect(oceanAudioContext.destination);
        tone.start(time);
        tone.stop(time + 0.15);
    }

    function triggerEdgeImpact(side) {
        var ripple = document.createElement("div");
        ripple.className = "edge-ripple " + (side > 0 ? "right" : "left");
        document.body.appendChild(ripple);
        setTimeout(function () {
            if (ripple.parentNode) ripple.parentNode.removeChild(ripple);
        }, 550);
    }

    function playBubbleSound() {
        if (!oceanAudioContext || oceanAudioContext.state !== "running") return;

        var time = oceanAudioContext.currentTime;
        var tone = oceanAudioContext.createOscillator();
        var volume = oceanAudioContext.createGain();

        tone.type = "sine";
        tone.frequency.setValueAtTime(420, time);
        tone.frequency.exponentialRampToValueAtTime(700, time + 0.12);

        volume.gain.setValueAtTime(0.035, time);
        volume.gain.exponentialRampToValueAtTime(0.001, time + 0.16);

        tone.connect(volume);
        volume.connect(oceanAudioContext.destination);
        tone.start(time);
        tone.stop(time + 0.17);
    }

    window.onload = function () {

        //************************************************************//
        //
        // INITIALIZE WEBGL
        //
        c = document.getElementById('c'); // setup canvas
        c.width = window.innerWidth;
        c.height = window.innerHeight;

        gl = c.getContext('webgl'); // setup GL context
        gl.viewport(0, 0, c.width, c.height);

        window.addEventListener('resize', function () {
            c.width = window.innerWidth;
            c.height = window.innerHeight;
            gl.viewport(0, 0, c.width, c.height);
        });

        //************************************************************//
        //
        // SHADERS
        //
        v_shader = gl.createShader(gl.VERTEX_SHADER);
        f_shader = gl.createShader(gl.FRAGMENT_SHADER);

        // compile vertex shader
        gl.shaderSource(v_shader, document.getElementById('vertexshader').innerText);
        gl.compileShader(v_shader);

        if (!gl.getShaderParameter(v_shader, gl.COMPILE_STATUS)) {
            console.log(gl.getShaderInfoLog(v_shader));
        }

        // compile fragment shader
        gl.shaderSource(f_shader, document.getElementById('fragmentshader').innerText);
        gl.compileShader(f_shader);

        if (!gl.getShaderParameter(f_shader, gl.COMPILE_STATUS)) {
            console.log(gl.getShaderInfoLog(f_shader));
        }

        // attach and link the shaders
        shaderprogram = gl.createProgram();
        gl.attachShader(shaderprogram, v_shader);
        gl.attachShader(shaderprogram, f_shader);

        gl.linkProgram(shaderprogram);

        gl.useProgram(shaderprogram);

        // create one large red fish at the center
        all_fish = [];
        all_fish.push(createFish(new Float32Array([0, 0, 0]), new Float32Array([1., 0., 0., 1.]), 1, -1));

        // add 100 smaller fish with random colors, random offsets, and random scales
        for (var i = 0; i < 100; i++) {
            var color = new Float32Array([Math.random(), Math.random(), Math.random(), Math.random()]);
            var offset = new Float32Array([Math.random() * 2 - 1, Math.random() * 2 - 1, 0]);
            var scale = Math.random() * 0.2 + 0.1;
            all_fish.push(createFish(offset, color, scale, 1));
        }

        document.addEventListener("keydown", function (event) {
            var bigFishOffset = all_fish[0][2];

            if (event.key === "ArrowUp") {
                bigFishOffset[1] += 0.05;
            } else if (event.key === "ArrowDown") {
                bigFishOffset[1] -= 0.05;
            } else {
                return;
            }

            event.preventDefault();
        });

        document.getElementById("soundButton").addEventListener("click", toggleOceanSound);

        animate();

    };

    function createFish(offset, color, scale, direction) {
        if (scale === undefined) scale = 1.0;
        if (direction === undefined) {
            direction = new Float32Array([-1, -1]);
        } else if (typeof direction === 'number') {
            direction = new Float32Array([direction, direction]);
        } else if (Array.isArray(direction)) {
            direction = new Float32Array(direction);
        }

        //************************************************************//
        //
        // CREATE GEOMETRY
        //
        const vertices = new Float32Array([
            0.5, 0.0, 0.0,
            0.2, 0.25, 0.0,
            -0.2, 0.15, 0.0,
            -0.4, 0.3, 0.0,
            -0.4, -0.3, 0.0,
            -0.2, -0.15, 0.0,
            0.2, -0.25, 0.0
        ]);

        const indices = new Uint8Array([
            0, 1, 6,
            1, 2, 6,
            2, 5, 6,
            2, 3, 5,
            3, 4, 5
        ]);

        var v_buffer = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, v_buffer);
        gl.bufferData(gl.ARRAY_BUFFER, vertices, gl.STATIC_DRAW);
        gl.bindBuffer(gl.ARRAY_BUFFER, null);

        var i_buffer = gl.createBuffer();
        gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, i_buffer);
        gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, indices, gl.STATIC_DRAW);
        gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, null);

        const eye_vertex = new Float32Array([0.2, 0.2, 0.0]);

        var eye_v_buffer = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, eye_v_buffer);
        gl.bufferData(gl.ARRAY_BUFFER, eye_vertex, gl.STATIC_DRAW);
        gl.bindBuffer(gl.ARRAY_BUFFER, null);

        return [v_buffer, i_buffer, offset, color, scale, direction, eye_v_buffer];

    }

    var step_x = .01;
    var step_y = .01;

    function animate() {

        requestAnimationFrame(animate);

        gl.clearColor(0., 0., 0., 0.);
        gl.clear(gl.COLOR_BUFFER_BIT);
        gl.enable(gl.BLEND);
        gl.blendEquation(gl.FUNC_ADD);
        gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
        gl.disable(gl.DEPTH_TEST);

        var a_position = gl.getAttribLocation(shaderprogram, 'a_position');
        var u_transform = gl.getUniformLocation(shaderprogram, 'u_transform');
        var u_color = gl.getUniformLocation(shaderprogram, 'u_color');
        var u_pointsize = gl.getUniformLocation(shaderprogram, 'u_pointsize');
        var u_is_eye = gl.getUniformLocation(shaderprogram, 'u_is_eye');
        var u_is_hero = gl.getUniformLocation(shaderprogram, 'u_is_hero');
        var u_time = gl.getUniformLocation(shaderprogram, 'u_time');
        var u_wiggle_freq = gl.getUniformLocation(shaderprogram, 'u_wiggle_freq');
        var u_wiggle_phase = gl.getUniformLocation(shaderprogram, 'u_wiggle_phase');

        var t = performance.now() * 0.001;
        if (u_time) gl.uniform1f(u_time, t);

        for (var r = 0; r < all_fish.length; r++) {

            var current_buffers = all_fish[r];
            var current_v_buffer = current_buffers[0];
            var current_i_buffer = current_buffers[1];
            var current_offset = current_buffers[2];
            var current_color = current_buffers[3];
            var current_scale = current_buffers[4];
            var current_direction = current_buffers[5];
            var current_eye_v_buffer = current_buffers[6];

            // update offsets: move along X, reverse direction at edges, small random Y wiggle
            if (current_offset[0] >= 1.) {
                if (r === 0) {
                    playEdgeSound();
                    triggerEdgeImpact(1);
                }
                if (current_direction.length !== undefined) {
                    current_direction[0] = -1;
                } else {
                    current_buffers[5] = -1;
                    current_direction = -1;
                }
            } else if (current_offset[0] <= -1.) {
                if (r === 0) {
                    playEdgeSound();
                    triggerEdgeImpact(-1);
                }
                if (current_direction.length !== undefined) {
                    current_direction[0] = 1;
                } else {
                    current_buffers[5] = 1;
                    current_direction = 1;
                }
            }

            var dir_x = (current_direction.length !== undefined) ? current_direction[0] : current_direction;
            current_offset[0] += dir_x * step_x;

            // small random Y wiggle
            current_offset[1] += (Math.random() - 0.5) * 0.03;
            if (current_offset[1] > 1.) {
                current_offset[1] = 1.;
            } else if (current_offset[1] < -1.) {
                current_offset[1] = -1.;
            }

            //************************************************************//
            //
            // CONNECT SHADER WITH GEOMETRY
            //
            gl.bindBuffer(gl.ARRAY_BUFFER, current_v_buffer);
            gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, current_i_buffer);

            gl.vertexAttribPointer(a_position, 3, gl.FLOAT, false, 0, 0);
            gl.enableVertexAttribArray(a_position);

            var theta = (r === 0) ? 0 : 5 * Math.PI / 180;
            var c = Math.cos(theta);
            var s = Math.sin(theta);

            var u_transform_matrix = new Float32Array([
                current_direction[0] * current_scale * c, current_scale * s, 0, 0,
                -current_direction[0] * current_scale * s, current_scale * c, 0, 0,
                0, 0, current_scale, 0,
                current_offset[0], current_offset[1], 0, 1
            ]);

            gl.uniformMatrix4fv(u_transform, false, u_transform_matrix);

            var isHero = (r === 0);

            if (isHero) {
                current_color = new Float32Array([1.0, 0.15, 0.18, 0.9]);
            } else {
                var fishT = t + r * 0.08;
                var a = 0.65 + 0.35 * Math.sin(fishT * 2.0);
                current_color = new Float32Array([
                    0.28 + 0.22 * Math.sin(fishT),
                    0.62 + 0.22 * Math.sin(fishT + 2.0),
                    0.88 + 0.12 * Math.sin(fishT + 4.0),
                    a
                ]);
            }

            gl.uniform4fv(u_color, current_color);

            if (u_is_hero) gl.uniform1f(u_is_hero, isHero ? 1.0 : 0.0);
            if (u_is_eye) gl.uniform1f(u_is_eye, 0.0);
            if (u_wiggle_freq) gl.uniform1f(u_wiggle_freq, isHero ? 6.5 : 10.5);
            if (u_wiggle_phase) gl.uniform1f(u_wiggle_phase, isHero ? 0.0 : r * 0.7);

            //************************************************************//
            //
            // DRAW BODY
            //
            gl.drawElements(gl.TRIANGLES, 15, gl.UNSIGNED_BYTE, 0);

            //************************************************************//
            //
            // DRAW EYE
            //
            gl.bindBuffer(gl.ARRAY_BUFFER, current_eye_v_buffer);
            gl.vertexAttribPointer(a_position, 3, gl.FLOAT, false, 0, 0);

            if (u_is_eye) gl.uniform1f(u_is_eye, 1.0);
            if (u_wiggle_freq) gl.uniform1f(u_wiggle_freq, 0.0); // eye does not wiggle

            var eyeSize = isHero ? 24.0 : Math.max(5.0, current_scale * 24.0);
            gl.uniform1f(u_pointsize, eyeSize);
            gl.uniform4fv(u_color, new Float32Array([0., 0., 0., 0.5]));

            gl.drawArrays(gl.POINTS, 0, 1);

        }

    }

</script>
