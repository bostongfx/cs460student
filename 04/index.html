<html>

<head>
    <meta content="text/html;charset=utf-8" http-equiv="Content-Type">
    <meta content="utf-8" http-equiv="encoding">
    <title>Default WebGL!</title>
    <style>
        html,
        body {
            background: url('https://cs460.org/assignments/04/bg.jpg');
            background-size: cover;
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden !important;
        }

        #c {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<script type="text/javascript" src="https://cs460.org/js/glmatrix.js"></script>

<script id="vertexshader" type="glsl">
    attribute vec3 a_position;

    uniform mat4 u_transform;
    uniform float u_pointsize;

    void main(void) {

      gl_PointSize = u_pointsize;
      gl_Position = u_transform * vec4( a_position, 1.);
    
    }
  </script>

<script id="fragmentshader" type="glsl">
    precision mediump float;

    uniform vec4 u_color;

    void main(void) {

      gl_FragColor = u_color;

    }
  </script>

<script>

    var c, gl;
    var v_shader, f_shader, shaderprogram;
    var vertices, indices, v_buffer, i_buffer;

    window.onload = function () {

        //************************************************************//
        //
        // INITIALIZE WEBGL
        //
        c = document.getElementById('c'); // setup canvas
        c.width = window.innerWidth;
        c.height = window.innerHeight;

        gl = c.getContext('webgl'); // setup GL context
        gl.viewport(0, 0, c.width, c.height);


        //************************************************************//
        //
        // SHADERS
        //
        v_shader = gl.createShader(gl.VERTEX_SHADER);
        f_shader = gl.createShader(gl.FRAGMENT_SHADER);

        // compile vertex shader
        gl.shaderSource(v_shader, document.getElementById('vertexshader').innerText);
        gl.compileShader(v_shader);

        if (!gl.getShaderParameter(v_shader, gl.COMPILE_STATUS)) {
            console.log(gl.getShaderInfoLog(v_shader));
        }

        // compile fragment shader
        gl.shaderSource(f_shader, document.getElementById('fragmentshader').innerText);
        gl.compileShader(f_shader);

        if (!gl.getShaderParameter(f_shader, gl.COMPILE_STATUS)) {
            console.log(gl.getShaderInfoLog(f_shader));
        }

        // attach and link the shaders
        shaderprogram = gl.createProgram();
        gl.attachShader(shaderprogram, v_shader);
        gl.attachShader(shaderprogram, f_shader);

        gl.linkProgram(shaderprogram);

        gl.useProgram(shaderprogram);


        // create one large red fish at the center
        all_fish = [];
        all_fish.push(createFish(new Float32Array([0, 0, 0]), new Float32Array([1., 0., 0., 1.]), 1, -1));
        // add 100 smaller fish with random colors, random offsets, and random scales
        for (var i = 0; i < 100; i++) {
            var color = new Float32Array([Math.random(), Math.random(), Math.random(), Math.random()]);
            var offset = new Float32Array([Math.random() * 2 - 1, Math.random() * 2 - 1, 0]);
            var scale = Math.random() * 0.2 + 0.1;
            all_fish.push(createFish(offset, color, scale, 1));
        }


        animate();

    };


    function createFish(offset, color, scale, direction) {
        if (scale === undefined) scale = 1.0;
        if (direction === undefined) {
            direction = new Float32Array([-1, -1]);
        } else if (typeof direction === 'number') {
            direction = new Float32Array([direction, direction]);
        } else if (Array.isArray(direction)) {
            direction = new Float32Array(direction);
        }

        //************************************************************//
        //
        // CREATE GEOMETRY
        //
        const vertices = new Float32Array([
            0.5, 0.0, 0.0,
            0.2, 0.25, 0.0,
            -0.2, 0.15, 0.0,
            -0.4, 0.3, 0.0,
            -0.4, -0.3, 0.0,
            -0.2, -0.15, 0.0,
            0.2, -0.25, 0.0
        ]);

        const indices = new Uint8Array([
            0, 1, 6,
            1, 2, 6,
            2, 5, 6,
            2, 3, 5,
            3, 4, 5
        ]);

        var v_buffer = gl.createBuffer(); // create
        gl.bindBuffer(gl.ARRAY_BUFFER, v_buffer); // bind
        gl.bufferData(gl.ARRAY_BUFFER, vertices, gl.STATIC_DRAW); // put data in
        gl.bindBuffer(gl.ARRAY_BUFFER, null); // unbind

        var i_buffer = gl.createBuffer(); // create
        gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, i_buffer); // bind
        gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, indices, gl.STATIC_DRAW); // put data in
        gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, null); // unbind

        const eye_vertex = new Float32Array([0.2, 0.2, 0.0]);

        var eye_v_buffer = gl.createBuffer(); // create
        gl.bindBuffer(gl.ARRAY_BUFFER, eye_v_buffer); // bind
        gl.bufferData(gl.ARRAY_BUFFER, eye_vertex, gl.STATIC_DRAW); // put data in
        gl.bindBuffer(gl.ARRAY_BUFFER, null); // unbind


        return [v_buffer, i_buffer, offset, color, scale, direction, eye_v_buffer];

    };

    var step_x = .01;
    var step_y = .01;

    function animate() {

        requestAnimationFrame(animate);

        gl.clearColor(0., 0., 0., 0.)
        gl.clear(gl.COLOR_BUFFER_BIT);
        gl.enable(gl.BLEND);
        gl.blendEquation(gl.FUNC_ADD);
        gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
        gl.disable(gl.DEPTH_TEST);



        for (var r = 0; r < all_fish.length; r++) {

            // current_buffers is a list of [v_buffer, i_buffer]-pairs
            var current_buffers = all_fish[r];
            var current_v_buffer = current_buffers[0];
            var current_i_buffer = current_buffers[1];
            var current_offset = current_buffers[2];
            var current_color = current_buffers[3];
            var current_scale = current_buffers[4];
            var current_direction = current_buffers[5];
            var current_eye_v_buffer = current_buffers[6];

            // update offsets: move along X, reverse direction at edges, small random Y wiggle
            if (current_offset[0] >= 1.) {
                if (current_direction.length !== undefined) {
                    current_direction[0] = -1;
                } else {
                    current_buffers[5] = -1;
                    current_direction = -1;
                }
            } else if (current_offset[0] <= -1.) {
                if (current_direction.length !== undefined) {
                    current_direction[0] = 1;
                } else {
                    current_buffers[5] = 1;
                    current_direction = 1;
                }
            }

            var dir_x = (current_direction.length !== undefined) ? current_direction[0] : current_direction;
            current_offset[0] += dir_x * step_x;

            // small random Y wiggle
            current_offset[1] += (Math.random() - 0.5) * 0.03;
            if (current_offset[1] > 1.) {
                current_offset[1] = 1.;
            } else if (current_offset[1] < -1.) {
                current_offset[1] = -1.;
            }




            //************************************************************//
            //
            // CONNECT SHADER WITH GEOMETRY
            //

            gl.bindBuffer(gl.ARRAY_BUFFER, current_v_buffer);

            gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, current_i_buffer);

            // find the attribute in the shader source
            var a_position = gl.getAttribLocation(shaderprogram, 'a_position');

            gl.vertexAttribPointer(a_position, 3, gl.FLOAT, false, 0, 0);

            gl.enableVertexAttribArray(a_position);

            // find the uniform in the shader source
            var u_transform = gl.getUniformLocation(shaderprogram, 'u_transform');

            var theta = (r === 0) ? 0 : 5 * Math.PI / 180;
            var c = Math.cos(theta);
            var s = Math.sin(theta);

            var u_transform_matrix = new Float32Array([
                current_direction[0] * current_scale * c, current_scale * s, 0, 0,
                -current_direction[0] * current_scale * s, current_scale * c, 0, 0,
                0, 0, current_scale, 0,
                current_offset[0], current_offset[1], 0, 1
            ]);

            gl.uniformMatrix4fv(u_transform, false, u_transform_matrix);

            var u_color = gl.getUniformLocation(shaderprogram, 'u_color');

            var t = performance.now() * 0.001;
            var a = 0.6 + 0.4 * Math.sin(t * 2.0);

            current_color = new Float32Array([
                0.3 + 0.2 * Math.sin(t),
                0.6 + 0.2 * Math.sin(t + 2.0),
                0.9 + 0.1 * Math.sin(t + 4.0),
                a
            ]);

            if (r == 0) {
                current_color = new Float32Array([1, 0, 0, 0.7]);
            }

            gl.uniform4fv(u_color, current_color);

            //************************************************************//
            //
            // DRAW!
            //


            // gl.drawArrays( gl.TRIANGLES, 0, 6 );
            gl.drawElements(gl.TRIANGLES, 15, gl.UNSIGNED_BYTE, 0);

            // draw eye
            gl.bindBuffer(gl.ARRAY_BUFFER, current_eye_v_buffer);
            gl.vertexAttribPointer(a_position, 3, gl.FLOAT, false, 0, 0);

            var u_pointsize = gl.getUniformLocation(shaderprogram, 'u_pointsize');
            gl.uniform1f(u_pointsize, current_scale * 20.);

            gl.uniform4fv(u_color, new Float32Array([0., 0., 0., 0.5]));

            gl.drawArrays(gl.POINTS, 0, 1);

        }


    };

</script>

<body>
    <canvas id="c"></canvas>
</body>

</html>
