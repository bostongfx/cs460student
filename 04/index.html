<html>
  <head>
    <meta content="text/html;charset=utf-8" http-equiv="Content-Type">
    <meta content="utf-8" http-equiv="encoding">
    <title>Default WebGL!</title>
    <style>
      html, body { 
        background-color:#000;
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden !important;  
      }

      body {
        background: url('https://cs460.org/assignments/04/bg.jpg');
        background-size: cover;
      }

      #c {
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <script type="text/javascript" src="https://cs460.org/js/glmatrix.js"></script>
  
  <script id="vertexshader" type="glsl">
    attribute vec3 a_position;

    uniform mat4 u_transform;

    uniform float u_pointsize;

    void main(void) {

      vec4 final_position = u_transform * vec4( a_position, 1.);
      gl_Position = final_position;
      gl_PointSize = u_pointsize;
    }
  </script>
  
  <script id="fragmentshader" type="glsl">
    precision mediump float;

    uniform vec4 u_color;

    void main(void) {

      gl_FragColor = u_color;

    }
  </script>
  
  <script>

    var c, gl;
    var v_shader, f_shader, shaderprogram;
    var vertices, indices, v_buffer, i_buffer;

    window.onload = function() {

      //************************************************************//
      //
      // INITIALIZE WEBGL
      //
      c = document.getElementById( 'c' ); // setup canvas
      c.width = window.innerWidth;
      c.height = window.innerHeight;

      gl = c.getContext( 'webgl' ); // setup GL context
      gl.viewport(0, 0, c.width, c.height );


      //************************************************************//
      //
      // SHADERS
      //
      v_shader = gl.createShader( gl.VERTEX_SHADER );
      f_shader = gl.createShader( gl.FRAGMENT_SHADER );
      
      // compile vertex shader
      gl.shaderSource( v_shader, document.getElementById( 'vertexshader' ).innerText );
      gl.compileShader( v_shader );

      if (!gl.getShaderParameter( v_shader, gl.COMPILE_STATUS)) {
        console.log(gl.getShaderInfoLog( v_shader ));
      }

      // compile fragment shader
      gl.shaderSource( f_shader, document.getElementById( 'fragmentshader' ).innerText );
      gl.compileShader( f_shader );

      if (!gl.getShaderParameter( f_shader, gl.COMPILE_STATUS)) {
        console.log(gl.getShaderInfoLog( f_shader ));
      }

      // attach and link the shaders
      shaderprogram = gl.createProgram();
      gl.attachShader( shaderprogram, v_shader );
      gl.attachShader( shaderprogram, f_shader );

      gl.linkProgram( shaderprogram );

      gl.useProgram( shaderprogram );


      // create multiple fishes
      all_fish = [];

      // the big red fish (always first in the list)
      all_fish.push( createFish( [0, 0, 0], [1, 0, 0, 1], 1, -1 ) );
      
      big_eye_left = all_fish[0][2];  // already made with direction -1 (eye at -0.1)
      big_eye_right = createFish( [0, 0, 0], [0, 0, 0, 0], 1, 1 )[2]; // borrow an upright eye buffer

      // 100 random little fish
      for ( var i = 0; i < 100; i++ ) {
        var random_color = [Math.random(), Math.random(), Math.random(), Math.random()];
        var random_offset = [Math.random() - Math.random(), Math.random() - Math.random(), 0];
        var random_scale = Math.random() * 0.3;
        all_fish.push( createFish( random_offset, random_color, random_scale, 1 ) );
      }

      window.addEventListener( 'keydown', function(e) {
        keys[e.key] = true;
        if ( e.key.startsWith('Arrow') ) e.preventDefault(); // stop page scrolling
      });
      window.addEventListener( 'keyup', function(e) {
        keys[e.key] = false;
      });
      
      animate();

    };


    function createFish(offset, color, scale, direction) {


      //************************************************************//
      //
      // CREATE GEOMETRY
      //
      var vertices = new Float32Array([
         0.5,  0.0, 0.0,   // 0: nose
         0.2,  0.25, 0.0,  // 1: upper body
        -0.2,  0.15, 0.0,  // 2: upper tail base
        -0.4,  0.3, 0.0,   // 3: upper tail tip
        -0.4, -0.3, 0.0,   // 4: lower tail tip
        -0.2, -0.15, 0.0,  // 5: lower tail base
         0.2, -0.25, 0.0   // 6: lower body
      ]);

      var indices = new Uint8Array([
        0, 1, 6,   // main body
        1, 2, 6,   // upper mid-body
        2, 5, 6,   // rear body
        2, 3, 5,   // tail top
        3, 4, 5    // tail fin
      ]);

      var v_buffer = gl.createBuffer(); // create
      gl.bindBuffer( gl.ARRAY_BUFFER, v_buffer ); // bind
      gl.bufferData( gl.ARRAY_BUFFER, vertices, gl.STATIC_DRAW ); // put data in
      gl.bindBuffer( gl.ARRAY_BUFFER, null ); // unbind

      var i_buffer = gl.createBuffer(); // create
      gl.bindBuffer( gl.ELEMENT_ARRAY_BUFFER, i_buffer ); // bind
      gl.bufferData( gl.ELEMENT_ARRAY_BUFFER, indices, gl.STATIC_DRAW ); // put data in
      gl.bindBuffer( gl.ELEMENT_ARRAY_BUFFER, null ); // unbind

      
      // eye: a single point near the front of the fish
      var eye_vertex = new Float32Array([0.2, 0.1, 0.0]);
      if ( direction == -1 ) {
        eye_vertex = new Float32Array([0.2, -0.1, 0.0]);
      }

      var eye_v_buffer = gl.createBuffer(); // create
      gl.bindBuffer( gl.ARRAY_BUFFER, eye_v_buffer ); // bind
      gl.bufferData( gl.ARRAY_BUFFER, eye_vertex, gl.STATIC_DRAW ); // put data in
      gl.bindBuffer( gl.ARRAY_BUFFER, null ); // unbind

      return [v_buffer, i_buffer, eye_v_buffer, offset, color, scale, direction];

    };

    var keys = {}; // which keys are currently held down
    var score = 0;

    var big_eye_left, big_eye_right; // eye buffers for the big fish
    
    var step_x = .01;
    var step_y = .01;
    var direction = -1;

    function animate() {

      requestAnimationFrame(animate);

      gl.clearColor( 0., 0., 0., 0.)
      gl.clear( gl.COLOR_BUFFER_BIT );
      
      gl.enable( gl.BLEND );
      gl.blendEquation( gl.FUNC_ADD );
      gl.blendFunc( gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA );

      gl.disable( gl.DEPTH_TEST );

      for( var r = 0; r < all_fish.length; r++ ) {

        // current_buffers is a list of [v_buffer, i_buffer]-pairs
        var current_buffers = all_fish[r];
        var current_v_buffer = current_buffers[0];
        var current_i_buffer = current_buffers[1];
        var current_eye_v_buffer = current_buffers[2];
        var current_offset = current_buffers[3];
        var current_color = current_buffers[4];
        var current_scale = current_buffers[5];
        var current_direction = current_buffers[6];

        if ( r == 0 ) {
          // BIG FISH: steered with the arrow keys
          var speed = 0.015;
          if ( keys['ArrowLeft'] )  { current_offset[0] -= speed; current_buffers[6] = -1; }
          if ( keys['ArrowRight'] ) { current_offset[0] += speed; current_buffers[6] = 1; }
          if ( keys['ArrowUp'] )    current_offset[1] += speed;
          if ( keys['ArrowDown'] )  current_offset[1] -= speed;

          // keep it on screen
          current_offset[0] = Math.max( -1, Math.min( 1, current_offset[0] ) );
          current_offset[1] = Math.max( -1, Math.min( 1, current_offset[1] ) );

          // face the way we're swimming, and use the matching eye
          current_direction = current_buffers[6];
          current_eye_v_buffer = ( current_direction == 1 ) ? big_eye_right : big_eye_left;
        } else {
          // LITTLE FISH: same as Part 5
          current_offset[0] += 0.01;
          current_offset[1] += 0.1 * Math.random();
          current_offset[1] -= 0.1 * Math.random();

          if ( current_offset[0] >= 1 ) {
            current_direction = -1;
          }
          current_offset[0] *= current_direction;

          // --- got eaten? ---
          var big = all_fish[0];
          var big_offset = big[3];
          var big_scale = big[5];

          var dx = current_offset[0] - big_offset[0];
          var dy = current_offset[1] - big_offset[1];

          // hitbox roughly the size of the big fish's body
          if ( Math.abs(dx) < 0.4 * big_scale && Math.abs(dy) < 0.2 * big_scale ) {

            // respawn the little fish at the left edge, random height
            current_offset[0] = -1;
            current_offset[1] = Math.random() * 2 - 1;

            // big fish grows a little (up to a limit)
            big[5] = Math.min( big_scale + 0.003, 1.2 );
            
            score++;
            document.getElementById('score').innerText = 'Score: ' + score;
          }
        }
        



        //************************************************************//
        //
        // CONNECT SHADER WITH GEOMETRY
        //
        
        gl.bindBuffer( gl.ARRAY_BUFFER, current_v_buffer );

        gl.bindBuffer( gl.ELEMENT_ARRAY_BUFFER, current_i_buffer );

        // find the attribute in the shader source
        var a_position = gl.getAttribLocation( shaderprogram, 'a_position' );

        gl.vertexAttribPointer( a_position, 3, gl.FLOAT, false, 0, 0 );

        gl.enableVertexAttribArray ( a_position );

        var theta = Math.random() * 10 * Math.PI / 180; // random 0..10 degrees, in radians

        var transform = [current_direction * current_scale * Math.cos(theta), current_scale * Math.sin(theta), 0, 0,
                         -current_scale * Math.sin(theta), current_direction * current_scale * Math.cos(theta), 0, 0,
                         0, 0, current_direction * current_scale * 1, 0,
                         current_offset[0], current_offset[1], current_offset[2], 1];

        var u_transform = gl.getUniformLocation( shaderprogram, 'u_transform' );
        gl.uniformMatrix4fv( u_transform, false, new Float32Array(transform) );

        var u_color = gl.getUniformLocation( shaderprogram, 'u_color' );
        
        // pulsing blue-ish color for the little fish
        var t = performance.now() * 0.001;          // time in seconds
        var a = 0.6 + 0.4 * Math.sin(t * 2.0);      // alpha pulses between 0.2 and 1.0
        current_color = new Float32Array([
          0.3 + 0.2 * Math.sin(t + 0.0),
          0.6 + 0.2 * Math.sin(t + 2.0),
          0.9 + 0.1 * Math.sin(t + 4.0),
          a
        ]);

        if ( r == 0 ) {
          // the big fish (first in the list) stays red
          current_color = new Float32Array([1, 0, 0, .7]);
        }

        gl.uniform4fv( u_color, current_color );

        //************************************************************//
        //
        // DRAW!
        //


        // gl.drawArrays( gl.TRIANGLES, 0, 6 );
        gl.drawElements( gl.TRIANGLES, 15, gl.UNSIGNED_BYTE, 0);

        
        // draw the eye
        gl.uniform4fv( u_color, new Float32Array([0, 0, 0, .5]) );

        var u_pointsize = gl.getUniformLocation( shaderprogram, 'u_pointsize' );
        gl.uniform1f( u_pointsize, current_scale * 20. );

        gl.bindBuffer( gl.ARRAY_BUFFER, current_eye_v_buffer );
        gl.vertexAttribPointer( a_position, 3, gl.FLOAT, false, 0, 0 );
        gl.enableVertexAttribArray( a_position );

        gl.drawArrays( gl.POINTS, 0, 1 );

      }


    };

  </script>
  <body>
    <canvas id="c"></canvas>
        <div id="score" style="position:absolute; top:12px; right:16px; color:white;
         font-family:sans-serif; font-size:24px; font-weight:bold;
         text-shadow:0 0 6px black;">Score: 0</div>
  </body>
</html>
