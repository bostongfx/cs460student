<html>

<head>
    <meta content="text/html;charset=utf-8" http-equiv="Content-Type">
    <meta content="utf-8" http-equiv="encoding">
    <title>Default WebGL!</title>
    <style>
        html,
        body {
            background-color: #000;
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden !important;
            background: url('https://cs460.org/assignments/04/bg.jpg');
            background-size: cover;
        }

        #c {
            width: 100%;
            height: 100%;
        }
    </style>
</head>

<script type="text/javascript" src="https://cs460.org/js/glmatrix.js"></script>

<script id="vertexshader" type="glsl">

    attribute vec3 a_position;

    uniform mat4 u_transform;
    uniform float u_pointsize;

    void main(void) {

        vec4 final_position = u_transform * vec4(a_position, 1.0);

        gl_Position = final_position;

        gl_PointSize = u_pointsize;
    }

    
    /*attribute vec3 a_position;

    uniform vec3 u_offset;
    uniform float u_scale;
    uniform float u_direction;
    uniform float u_pointsize;
    uniform mat4 u_transform;

    void main(void) {
        vec3 position = a_position;

        position.x *= u_scale * u_direction;
        position.y *= u_scale;

        vec4 final_position = u_transform * vec4(position, 1.0);

        gl_Position = final_position;

        gl_PointSize = u_pointsize;
    }*/
</script>

<script id="fragmentshader" type="glsl">
    precision mediump float;

    uniform vec4 u_color;

    void main(void) {
        gl_FragColor = u_color;
    }
</script>

<script>
    var c, gl;
    var v_shader, f_shader, shaderprogram;
    var vertices, indices, v_buffer, i_buffer;
    var all_fish;
    var mouse_control = false;


    window.onload = function () {

        // INITIALIZE WEBGL

        c = document.getElementById('c');
        c.width = window.innerWidth;
        c.height = window.innerHeight;

        gl = c.getContext('webgl');
        gl.viewport(0, 0, c.width, c.height);

        // SHADERS

        v_shader = gl.createShader(gl.VERTEX_SHADER);
        f_shader = gl.createShader(gl.FRAGMENT_SHADER);

        // compile vertex shader
        gl.shaderSource(v_shader, document.getElementById('vertexshader').innerText);
        gl.compileShader(v_shader);

        if (!gl.getShaderParameter(v_shader, gl.COMPILE_STATUS)) {
            console.log(gl.getShaderInfoLog(v_shader));
        }

        // compile fragment shader
        gl.shaderSource(f_shader, document.getElementById('fragmentshader').innerText);
        gl.compileShader(f_shader);

        if (!gl.getShaderParameter(f_shader, gl.COMPILE_STATUS)) {
            console.log(gl.getShaderInfoLog(f_shader));
        }

        // attach and link shaders
        shaderprogram = gl.createProgram();
        gl.attachShader(shaderprogram, v_shader);
        gl.attachShader(shaderprogram, f_shader);
        gl.linkProgram(shaderprogram);
        gl.useProgram(shaderprogram);

        // create fish
        all_fish = [];

        all_fish.push(createFish(
            [0, 0, 0],
            [1, 0, 0, Math.random()],
            1,
            1
        ));

        for (var i = 0; i < 100; i++) {
            var random_color = [
                Math.random(),
                Math.random(),
                Math.random(),
                Math.random(),
            ];

            var random_offset = [
                Math.random() - Math.random(),
                Math.random() - Math.random(),
                0
            ];

            var random_scale = Math.random() * 0.3;

            all_fish.push(createFish(
                random_offset,
                random_color,
                random_scale,
                1
            ));
        }

        c.addEventListener('mousemove', function (event) {

            var rect = c.getBoundingClientRect();

            // Convert mouse coordinates to WebGL coordinates
            var mouse_x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
            var mouse_y = 1 - ((event.clientY - rect.top) / rect.height) * 2;

            // Move only the large red fish
            all_fish[0][4][0] = mouse_x;
            all_fish[0][4][1] = mouse_y;

        });

        animate();
    };

    function createFish(offset, color, scale = 1, direction = 1) {

        // CREATE FISH GEOMETRY

        var vertices = new Float32Array([
            0.5, 0.0, 0.0, // 0: nose
            0.2, 0.25, 0.0, // 1: upper body
            -0.2, 0.15, 0.0, // 2: upper tail base
            -0.4, 0.3, 0.0, // 3: upper tail tip
            -0.4, -0.3, 0.0, // 4: lower tail tip
            -0.2, -0.15, 0.0, // 5: lower tail base
            0.2, -0.25, 0.0  // 6: lower body
        ]);

        var indices = new Uint8Array([
            0, 1, 6, // main body
            1, 2, 6, // upper mid-body
            2, 5, 6, // rear body
            2, 3, 5, // tail top
            3, 4, 5  // tail fin
        ]);

        // create vertex buffer
        var v_buffer = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, v_buffer);
        gl.bufferData(gl.ARRAY_BUFFER, vertices, gl.STATIC_DRAW);
        gl.bindBuffer(gl.ARRAY_BUFFER, null);

        // create index buffer
        var i_buffer = gl.createBuffer();
        gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, i_buffer);
        gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, indices, gl.STATIC_DRAW);
        gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, null);

        // CREATE EYE GEOMETRY

        var eye_vertex = new Float32Array([0.2, 0.2, 0.0]);

        if (direction == -1) {
            eye_vertex = new Float32Array([0.2, 0.2, 0.0]);
        }


        // create eye vertex buffer
        var eye_v_buffer = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, eye_v_buffer);
        gl.bufferData(gl.ARRAY_BUFFER, eye_vertex, gl.STATIC_DRAW);
        gl.bindBuffer(gl.ARRAY_BUFFER, null);

        return [
            v_buffer,
            i_buffer,
            eye_v_buffer,
            new Float32Array(color),
            new Float32Array(offset),
            scale,
            direction
        ];
    };

    var step_x = .01;
    var step_y = .01;

    function animate() {
        requestAnimationFrame(animate);

        gl.clearColor(0., 0., 0., 0.);
        gl.clear(gl.COLOR_BUFFER_BIT);

        // ENABLE TRANSPARENCY
        gl.enable(gl.BLEND);
        gl.blendEquation(gl.FUNC_ADD);
        gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
        gl.disable(gl.DEPTH_TEST);

        for (var r = 0; r < all_fish.length; r++) {

            var current_buffers = all_fish[r];

            var current_v_buffer = current_buffers[0];
            var current_i_buffer = current_buffers[1];
            var current_eye_v_buffer = current_buffers[2];
            var current_color = current_buffers[3];
            var current_offset = current_buffers[4];
            var current_scale = current_buffers[5];
            var current_direction = current_buffers[6];

            // New Update Offsets

            // UPDATE OFFSETS
            if (r == 0) {

                // LARGE RED FISH ONLY

                current_offset[0] += current_direction * step_x;

                current_offset[1] += 0.1 * Math.random();
                current_offset[1] -= 0.1 * Math.random();

                // Calculate screen boundaries based on fish size
                var x_limit = 1 - 0.5 * current_scale;
                var y_limit = 1 - 0.3 * current_scale;

                // Reverse direction at horizontal boundaries
                if (current_offset[0] >= x_limit) {
                    current_offset[0] = x_limit;
                    current_direction = -1;
                } else if (current_offset[0] <= -x_limit) {
                    current_offset[0] = -x_limit;
                    current_direction = 1;
                }

                // Keep fish within vertical boundaries
                if (current_offset[1] >= y_limit) {
                    current_offset[1] = y_limit;
                } else if (current_offset[1] <= -y_limit) {
                    current_offset[1] = -y_limit;
                }

                // Save the updated direction
                current_buffers[6] = current_direction;

            } else {

                current_offset[0] += current_direction * step_x;

                current_offset[1] += 0.005 * Math.random();
                current_offset[1] -= 0.005 * Math.random();

                if (current_offset[0] >= 1) {
                    current_direction = -1;
                }

                current_offset[0] *= current_direction;
                current_buffers[6] = current_direction;

                current_offset[0] += current_direction * 0.01;

                if (current_offset[0] >= 1) {
                    current_direction = -1;
                } else if (current_offset[0] <= -1) {
                    current_direction = 1;
                }

                current_buffers[6] = current_direction;
            }


            // PASS TRANSFORMATION MATRIX (Note for teacher for somereason the -0.2 didn't work to scale so I adjusted.)

            var theta = (Math.random() * 20 - 5) * Math.PI / 180;

            /*var transform = [
                current_direction * current_scale * Math.cos(theta), Math.sin(theta), 0, 0,
                -Math.sin(theta), current_direction * current_scale * Math.cos(theta), 0, 0,
                0, 0, current_direction * current_scale * 1, 0,
                current_offset[0], current_offset[1], current_offset[2], 1
            ];*/

            var transform = [
                current_direction * current_scale * Math.cos(theta), current_scale * Math.sin(theta), 0, 0,
                -current_direction * current_scale * Math.sin(theta), current_scale * Math.cos(theta), 0, 0,
                0, 0, current_direction * current_scale * 1, 0,
                current_offset[0], current_offset[1], current_offset[2], 1
            ];



            // CONNECT SHADER WITH FISH GEOMETRY

            gl.bindBuffer(gl.ARRAY_BUFFER, current_v_buffer);
            gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, current_i_buffer);

            var a_position = gl.getAttribLocation(shaderprogram, 'a_position');
            gl.vertexAttribPointer(a_position, 3, gl.FLOAT, false, 0, 0);
            gl.enableVertexAttribArray(a_position);


            var u_transform = gl.getUniformLocation(shaderprogram, 'u_transform');
            gl.uniformMatrix4fv(u_transform, false, new Float32Array(transform));


            var u_color = gl.getUniformLocation(shaderprogram, 'u_color');
            // Get elapsed time in seconds
            var t = performance.now() * 0.001;
            // Calculate pulsating transparency
            var a = 0.6 + 0.4 * Math.sin(t * 2.0);

            // Set blue-ish pulsating color for the little fish
            current_color = new Float32Array([
                0.3 + 0.2 * Math.sin(t + 0.0),
                0.6 + 0.2 * Math.sin(t + 2.0),
                0.9 + 0.1 * Math.sin(t + 4.0),
                a
            ]);

            // Keep big red
            if (r == 0) {
                current_color = new Float32Array([1, 0, 0, 0.7]);
            }

            // Pass color to fragment shader
            gl.uniform4fv(u_color, current_color);

            var u_scale = gl.getUniformLocation(shaderprogram, 'u_scale');
            gl.uniform1f(u_scale, current_scale);

            var u_direction = gl.getUniformLocation(shaderprogram, 'u_direction');
            gl.uniform1f(u_direction, current_direction);

            // DRAW FISH TRIANGLES

            gl.drawElements(gl.TRIANGLES, 15, gl.UNSIGNED_BYTE, 0);

            // DRAW EYE

            // set eye color to black with transparency
            gl.uniform4fv(u_color, new Float32Array([0, 0, 0, .5]));

            // set eye size based on fish scale
            var u_pointsize = gl.getUniformLocation(shaderprogram, 'u_pointsize');
            gl.uniform1fv(u_pointsize, new Float32Array([current_scale * 20.]));

            // bind eye vertex buffer
            gl.bindBuffer(gl.ARRAY_BUFFER, current_eye_v_buffer);
            gl.vertexAttribPointer(a_position, 3, gl.FLOAT, false, 0, 0);
            gl.enableVertexAttribArray(a_position);

            // draw one point for the eye
            gl.drawArrays(gl.POINTS, 0, 1);
        }
    };
</script>

<body>
    <canvas id="c"></canvas>
</body>

</html>
