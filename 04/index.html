<html>
  <head>
    <meta content="text/html;charset=utf-8" http-equiv="Content-Type">
    <meta content="utf-8" http-equiv="encoding">
    <title>Default WebGL!</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #071b35;
        }

        body::before {
            content: "";
            position: fixed;
            inset: -30px;
            background-image: url('https://cs460.org/assignments/04/bg.jpg');
            background-size: cover;
            background-position: center;
            filter: blur(25px) brightness(0.7);
            z-index: 0;
            pointer-events: none;
        }

        body::after {
            content: "";
            position: fixed;
            inset: 0;
            background-image: url('https://cs460.org/assignments/04/bg.jpg');
            background-size: 100% 100%;
            background-position: center;
            background-repeat: no-repeat;
            z-index: 1;
            pointer-events: none;
        }

        #c {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            display: block;
        }

        #score {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 10;
            color: white;
            font-family: Arial, sans-serif;
            font-size: 28px;
            font-weight: bold;
            text-shadow: 2px 2px 5px black;
        }

        #winMessage {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 20;
            color: yellow;
            font-family: Arial, sans-serif;
            font-size: 60px;
            font-weight: bold;
            text-align: center;
            text-shadow: 3px 3px 8px black;
        }
    </style>
  </head>
  <script type="text/javascript" src="https://cs460.org/js/glmatrix.js"></script>
  
  <script id="vertexshader" type="glsl">
        attribute vec3 a_position;

        uniform mat4 u_transform;
        uniform float u_pointsize;

        void main(void) {
            vec4 final_position = u_transform * vec4(a_position, 1.0);

            gl_Position = final_position;
            gl_PointSize = u_pointsize;
        }
    </script>
  
  <script id="fragmentshader" type="glsl">
    precision mediump float;

    uniform vec4 u_color;

    void main(void) {

      gl_FragColor = u_color;

    }
  </script>
  
  <script>

    var c, gl;
    var score = 0;
    var v_shader, f_shader, shaderprogram;
    var vertices, indices, v_buffer, i_buffer;

    window.onload = function() {

      //************************************************************//
      //
      // INITIALIZE WEBGL
      //
      c = document.getElementById( 'c' ); // setup canvas
      c.width = window.innerWidth;
      c.height = window.innerHeight;

      gl = c.getContext( 'webgl' ); // setup GL context
      gl.viewport(0, 0, c.width, c.height );


      //************************************************************//
      //
      // SHADERS
      //
      v_shader = gl.createShader( gl.VERTEX_SHADER );
      f_shader = gl.createShader( gl.FRAGMENT_SHADER );
      
      // compile vertex shader
      gl.shaderSource( v_shader, document.getElementById( 'vertexshader' ).innerText );
      gl.compileShader( v_shader );

      if (!gl.getShaderParameter( v_shader, gl.COMPILE_STATUS)) {
        console.log(gl.getShaderInfoLog( v_shader ));
      }

      // compile fragment shader
      gl.shaderSource( f_shader, document.getElementById( 'fragmentshader' ).innerText );
      gl.compileShader( f_shader );

      if (!gl.getShaderParameter( f_shader, gl.COMPILE_STATUS)) {
        console.log(gl.getShaderInfoLog( f_shader ));
      }

      // attach and link the shaders
      shaderprogram = gl.createProgram();
      gl.attachShader( shaderprogram, v_shader );
      gl.attachShader( shaderprogram, f_shader );

      gl.linkProgram( shaderprogram );

      gl.useProgram( shaderprogram );


      // Create two fish
        all_fish = [];

        // One large red fish
        all_fish.push(createFish(
            new Float32Array([0, 0, 0]),
            new Float32Array([1, 0, 0, 1]),
            1,
            -1
        ));

        // Create 100 small colorful fish
        for (var i = 0; i < 100; i++) {
            var random_color = new Float32Array([
                Math.random(),
                Math.random(),
                Math.random(),
                Math.random()
            ]);

            var random_offset = new Float32Array([
                Math.random() - Math.random(),
                Math.random() - Math.random(),
                0
            ]);

            var random_scale = Math.random() * 0.3;

            all_fish.push(createFish(
                random_offset,
                random_color,
                random_scale,
                1
            ));
        }


      animate();

    };


    function createFish(offset, color, scale = 1, direction = 1) {

        // Fish geometry
        var vertices = new Float32Array([
            0.5,  0.0,  0.0,  // Nose
            0.2,  0.25, 0.0,  // Upper body
            -0.2,  0.15, 0.0,  // Upper tail base
            -0.4,  0.3,  0.0,  // Upper tail tip
            -0.4, -0.3,  0.0,  // Lower tail tip
            -0.2, -0.15, 0.0,  // Lower tail base
            0.2, -0.25, 0.0   // Lower body
        ]);

        var indices = new Uint8Array([
            0, 1, 6,
            1, 2, 6,
            2, 5, 6,
            2, 3, 5,
            3, 4, 5
        ]);

        // Vertex buffer
        var v_buffer = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, v_buffer);
        gl.bufferData(gl.ARRAY_BUFFER, vertices, gl.STATIC_DRAW);
        gl.bindBuffer(gl.ARRAY_BUFFER, null);

        // Index buffer
        var i_buffer = gl.createBuffer();
        gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, i_buffer);
        gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, indices, gl.STATIC_DRAW);
        gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, null);
        // Create eye geometry
        var eye_vertex = new Float32Array([0.2, 0.2, 0.0]);

        // Create eye vertex buffer
        var eye_v_buffer = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, eye_v_buffer);
        gl.bufferData(gl.ARRAY_BUFFER, eye_vertex, gl.STATIC_DRAW);
        gl.bindBuffer(gl.ARRAY_BUFFER, null);

        return [v_buffer, i_buffer, eye_v_buffer, color, offset, scale, direction];
    }

    var step_x = .01;
    var step_y = .01;
    var direction = -1;

    var keys = {
        ArrowUp: false,
        ArrowDown: false,
        ArrowLeft: false,
        ArrowRight: false
    };

    window.addEventListener('keydown', function(e) {
        if (e.key in keys) {
            keys[e.key] = true;
            e.preventDefault();
        }
    });

    window.addEventListener('keyup', function(e) {
        if (e.key in keys) {
            keys[e.key] = false;
            e.preventDefault();
        }
    });

    window.addEventListener('blur', function() {
        for (var key in keys) {
            keys[key] = false;
        }
    });

    function animate() {

      requestAnimationFrame(animate);
        
      // Check collisions between the red fish and blue fish
        var redFish = all_fish[0];

        for (var i = all_fish.length - 1; i >= 1; i--) {
            var smallFish = all_fish[i];

            var dx = redFish[4][0] - smallFish[4][0];
            var dy = redFish[4][1] - smallFish[4][1];

            var distance = Math.sqrt(dx * dx + dy * dy);

            if (distance < 0.25 + smallFish[5] * 0.2) {
                all_fish.splice(i, 1);
                score += 10;
                document.getElementById('score').textContent = 'Score: ' + score;
            }
        }

        // Check winning condition AFTER the collision loop
        if (all_fish.length === 1) {
            document.getElementById('winMessage').style.display = 'block';
        }

      gl.clearColor( 0., 0., 0., 0.)
      gl.clear( gl.COLOR_BUFFER_BIT );

      // Enable transparency
      gl.enable(gl.BLEND);
      gl.blendEquation(gl.FUNC_ADD);
      gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);

      // Disable depth testing
      gl.disable(gl.DEPTH_TEST);

      for( var r = 0; r < all_fish.length; r++ ) {

        // current_buffers is a list of [v_buffer, i_buffer]-pairs
        var current_buffers = all_fish[r];
        var current_v_buffer = current_buffers[0];
        var current_i_buffer = current_buffers[1];
        var current_eye_v_buffer = current_buffers[2];
        var current_color = current_buffers[3];
        var current_offset = current_buffers[4];
        var current_scale = current_buffers[5];
        var current_direction = current_buffers[6];

        if (r === 0) {
            // Large red fish: keyboard controls
            var speed = 0.01;

            if (keys.ArrowLeft) {
                current_offset[0] -= speed;
                current_buffers[6] = -1;
            }

            if (keys.ArrowRight) {
                current_offset[0] += speed;
                current_buffers[6] = 1;
            }
            if (keys.ArrowUp) current_offset[1] += speed;
            if (keys.ArrowDown) current_offset[1] -= speed;

            // Keep the red fish inside the aquarium
            current_offset[0] = Math.max(-0.5, Math.min(0.5, current_offset[0]));
            current_offset[1] = Math.max(-0.6, Math.min(0.6, current_offset[1]));

        } else {
            // Small fish: automatic swimming
            current_offset[0] += current_direction * 0.003;

            // Gentle vertical movement
            current_offset[1] += (Math.random() - 0.5) * 0.005;
            current_offset[1] = Math.max(-0.9, Math.min(0.9, current_offset[1]));

            // Wrap around horizontally
            if (current_offset[0] > 1.2) {
                current_offset[0] = -1.2;
            }
        }

        current_direction = current_buffers[6];
        



        //************************************************************//
        //
        // CONNECT SHADER WITH GEOMETRY
        //
        
        gl.bindBuffer( gl.ARRAY_BUFFER, current_v_buffer );

        gl.bindBuffer( gl.ELEMENT_ARRAY_BUFFER, current_i_buffer );

        // find the attribute in the shader source
        var a_position = gl.getAttribLocation( shaderprogram, 'a_position' );

        gl.vertexAttribPointer( a_position, 3, gl.FLOAT, false, 0, 0 );

        gl.enableVertexAttribArray ( a_position );

        // Random rotation between 0 and 10 degrees
        var theta = Math.random() * 10 * Math.PI / 180;

        var transform = [
            current_direction * current_scale * Math.cos(theta),
            current_direction * current_scale * Math.sin(theta), 0, 0,

            -current_scale * Math.sin(theta),
            current_scale * Math.cos(theta), 0, 0,

            0, 0, current_scale, 0,

            current_offset[0], current_offset[1], current_offset[2], 1
        ];

        var u_transform = gl.getUniformLocation(shaderprogram, 'u_transform');

        gl.uniformMatrix4fv(
            u_transform,
            false,
            new Float32Array(transform)
        );

        var u_color = gl.getUniformLocation(shaderprogram, 'u_color');

        if (r === 0) {
            // Keep the large fish red
            gl.uniform4fv(u_color, new Float32Array([1.0, 0.0, 0.0, 1.0]));
        } else {
            // Pulsating blue-ish colors for the small fish
            var pulse = (Math.sin(performance.now() * 0.002 + r * 0.3) + 1) / 2;

            gl.uniform4fv(u_color, new Float32Array([
                0.05 + pulse * 0.15,
                0.3 + pulse * 0.35,
                0.6 + pulse * 0.4,
                current_color[3]
            ]));
        }

        //************************************************************//
        //
        // DRAW!
        //


        // gl.drawArrays( gl.TRIANGLES, 0, 15 );
        gl.drawElements(gl.TRIANGLES, 15, gl.UNSIGNED_BYTE, 0);

        // Draw the fish eye
        var u_pointsize = gl.getUniformLocation(shaderprogram, 'u_pointsize');

        // Set eye color to black with slight transparency
        gl.uniform4fv(u_color, new Float32Array([0, 0, 0, 0.5]));

        // Make the eye size proportional to the fish
        gl.uniform1f(u_pointsize, current_scale * 20.0);

        // Bind the eye vertex buffer
        gl.bindBuffer(gl.ARRAY_BUFFER, current_eye_v_buffer);

        // Connect eye geometry to the vertex shader
        gl.vertexAttribPointer(a_position, 3, gl.FLOAT, false, 0, 0);
        gl.enableVertexAttribArray(a_position);

        // Render one point as the eye
        gl.drawArrays(gl.POINTS, 0, 1);

      }


    };

  </script>
  <body>
    <div id="score">Score: 0</div>
    <div id="winMessage">YOU WIN! 🏆</div>
    <canvas id="c"></canvas>
  </body>
</html>
