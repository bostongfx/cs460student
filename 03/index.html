<html>

<head>
    <style>
        html,
        body {
            background-color: #000;
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden !important;
        }
    </style>

    <script async src="https://unpkg.com/es-module-shims@1.6.3/dist/es-module-shims.js"></script>

    <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@latest/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@latest/examples/jsm/"
      }
    }
    </script>

    <script type="module">

        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        var renderer, controls, scene, camera;

        var LASTOBJECT = null;
        var flag = false;
        var toruses = [];
        var TORUSES = toruses;
        var FLICKERING = false;
        var wasFlickering = false;
        var WIREFRAME = false;

        window.onload = function () {

            // Three.js code goes here
            scene = new THREE.Scene();

            // setup the camera
            var fov = 75;
            var ratio = window.innerWidth / window.innerHeight;
            var zNear = 1;
            var zFar = 10000;
            camera = new THREE.PerspectiveCamera(fov, ratio, zNear, zFar);
            camera.position.set(0, 0, 100);

            // create renderer and setup the canvas
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            // interaction
            controls = new OrbitControls(camera, renderer.domElement);

            renderer.domElement.onmousedown = function (e) {
                
                if (!e.shiftKey) {
                    return;
                }

                controls.enabled = false;

                console.log('Yay! We clicked!');

                var pixel_coords = new THREE.Vector2(e.clientX, e.clientY);

                console.log('Pixel coords', pixel_coords);

                var vp_coords = new THREE.Vector2(
                    (pixel_coords.x / window.innerWidth) * 2 - 1,  //X
                    -(pixel_coords.y / window.innerHeight) * 2 + 1) // Y

                console.log('Viewport coords', vp_coords);

                var vp_coords_near = new THREE.Vector3(vp_coords.x, vp_coords.y, 0);


                var raycaster = new THREE.Raycaster();
                raycaster.setFromCamera(vp_coords_near, camera);
                var intersects = raycaster.intersectObject(invisible_plane);

                if (intersects.length > 0) {
                    console.log('Ray to Invisible Plane', intersects[0].point);

                    var geometry = new THREE.TorusKnotGeometry(10, 3, 100, 16);
                    var material = new THREE.MeshBasicMaterial({ color: 0xFF69B4, wireframe: WIREFRAME });
                    var torus = new THREE.Mesh(geometry, material);
                    torus.position.set(intersects[0].point.x, intersects[0].point.y, intersects[0].point.z);
                    scene.add(torus);
                    toruses.push(torus);

                    LASTOBJECT = torus;
                    flag = true;
                }
            };

            renderer.domElement.onmouseup = function (e) {
                controls.enabled = true;
                flag = false;
            }

            renderer.domElement.onmousemove = function (e) {
                if (!flag || !LASTOBJECT) return;

                console.log('movementY', e.movementY);
                var DELTA = -e.movementY * 0.01;

                LASTOBJECT.scale.set(
                    LASTOBJECT.scale.x + DELTA,
                    LASTOBJECT.scale.y + DELTA,
                    LASTOBJECT.scale.z + DELTA
                );

                if (LASTOBJECT.scale.x < 0) {
                    LASTOBJECT.material.color.set(0x7CFC00);
                } else {
                    LASTOBJECT.material.color.set(0xFF69B4);
                }
            };

            window.onkeypress = function (e) {
                if (e.key === 'f') {
                    FLICKERING = !FLICKERING;
                }
                if (e.key === 'w') {
                    WIREFRAME = !WIREFRAME;
                    toruses.forEach(function (torus) {
                        torus.material.wireframe = WIREFRAME;
                    });
                }
            }
            
            // setup lights
            var ambientLight = new THREE.AmbientLight();
            scene.add(ambientLight);

            var light = new THREE.DirectionalLight(0xffffff, 5.0);
            light.position.set(10, 100, 10);
            scene.add(light);

            // configure cube
            var geometry = new THREE.TorusKnotGeometry( 10, 3, 100, 16 );
            var material = new THREE.MeshBasicMaterial({ color: 0xFFFF00 });
            var torus = new THREE.Mesh(geometry, material);

            scene.add(torus);
            toruses.push(torus)



            //
            // The invisible plane
            //
            geometry = new THREE.PlaneGeometry(10000, 10000);
            material = new THREE.MeshBasicMaterial({
                visible: false
            });

            var invisible_plane = new THREE.Mesh(geometry, material);

            scene.add(invisible_plane);
            //
            //
            //


            // call animation/rendering loop
            animate();

        };

        function animate() {

            requestAnimationFrame(animate);

            // and here..
            controls.update();

            if (FLICKERING) {
                toruses.forEach(function (torus) {
                    torus.material.transparent = true;
                    torus.material.opacity = Math.random();
                    torus.material.needsUpdate = true;
                });
                wasFlickering = true;
            } else if (wasFlickering) {
                toruses.forEach(function (torus) {
                    torus.material.opacity = 1.0;
                    torus.material.transparent = false;
                    torus.material.needsUpdate = true;
                });
                wasFlickering = false;
            }
            renderer.render(scene, camera);

        };
    </script>
</head>

<body></body>

</html>
