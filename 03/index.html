<html>
  <head>
    <style>
      html, body { 
        background-color:#000;
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden !important;  
      }
    </style>
    
    <script async src="https://unpkg.com/es-module-shims@1.6.3/dist/es-module-shims.js"></script>

    <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@latest/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@latest/examples/jsm/"
      }
    }
    </script>

    <script type="module">

      import * as THREE from 'three';
      import { OrbitControls } from 'three/addons/controls/OrbitControls.js';      

      var renderer, controls, scene, camera;
      var LASTOBJECT, SCALING = false, FLICKERING = false, WIREFRAME = false;

      window.onload = function() {

        // Three.js code goes here
        scene = new THREE.Scene();

        // setup the camera
        var fov = 75;
        var ratio = window.innerWidth / window.innerHeight;
        var zNear = 1;
        var zFar = 10000;
        camera = new THREE.PerspectiveCamera( fov, ratio, zNear, zFar );
        camera.position.set(0, 0, 100);

        // create renderer and setup the canvas
        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize( window.innerWidth, window.innerHeight );
        document.body.appendChild( renderer.domElement );



        // setup lights
        var ambientLight = new THREE.AmbientLight();
        scene.add( ambientLight );

        var light = new THREE.DirectionalLight( 0xffffff, 5.0 );
        light.position.set( 10, 100, 10 );
        scene.add( light );

        // configure cube
        // var geometry = new THREE.BoxGeometry( 20, 20, 20 );
        // var material = new THREE.MeshStandardMaterial({ color: 0xffffff, wireframe: true });

        // var cube = new THREE.Mesh( geometry, material );

        // scene.add( cube );

        // check if torus works?
        var geometry = new THREE.TorusKnotGeometry( 12, 3, 100, 8 );
        var material = new THREE.MeshBasicMaterial( { color: 0xB0E0E6 } );
        var torusKnot = new THREE.Mesh( geometry, material );
        scene.add( torusKnot );




        //
        // The invisible plane
        //
        geometry = new THREE.PlaneGeometry( 10000, 10000 );
        material = new THREE.MeshBasicMaterial( {
          visible: false
        });

        var invisible_plane = new THREE.Mesh( geometry, material );

        scene.add( invisible_plane );
        //
        //
        //



        // interaction
        controls = new OrbitControls( camera, renderer.domElement );

        renderer.domElement.onmousedown = function( e ){

          if ( !e.shiftKey ) {
            return;
          }

          controls.enabled = false;

          var rect = renderer.domElement.getBoundingClientRect();
          var vp_coords = new THREE.Vector2(
            (( e.clientX - rect.left ) / rect.width ) * 2 - 1,
            -(( e.clientY - rect.top ) / rect.height ) * 2 + 1
          );

          var raycaster = new THREE.Raycaster();
          raycaster.setFromCamera( vp_coords, camera );
          var placement_plane = new THREE.Plane( new THREE.Vector3( 0, 0, 1 ), 0 );
          var intersection = raycaster.ray.intersectPlane(
            placement_plane,
            new THREE.Vector3()
          );

          if ( intersection === null ) {
            return;
          }

          var geometry = new THREE.TorusKnotGeometry( 12, 3, 100, 8 );
          var material = new THREE.MeshBasicMaterial( { color: 0xFF69B4 } );
          var torus = new THREE.Mesh( geometry, material );
          torus.position.copy( intersection );
          scene.add( torus );
          LASTOBJECT = torus;
          SCALING = true;
        };

        renderer.domElement.onmousemove = function( e ) {
          if ( SCALING ) {
            var DELTA = -e.movementY / 100;
            LASTOBJECT.scale.set(
              LASTOBJECT.scale.x + DELTA,
              LASTOBJECT.scale.y + DELTA,
              LASTOBJECT.scale.z + DELTA
            );
            LASTOBJECT.material.color.set(
              LASTOBJECT.scale.x < 0 ? 0x7CFC00 : 0xFF69B4
            );
          }
        };

        renderer.domElement.onmouseup = function() {
          SCALING = false;
          controls.enabled = true;
        };

        window.onkeypress = function( e ) {
          if ( e.key === 'f' ) {
            FLICKERING = !FLICKERING;
          }
          if ( e.key === 'w' ) {
            WIREFRAME = !WIREFRAME;
          }
        };

        // call animation/rendering loop
        animate();
        
      };

      function animate() {

        requestAnimationFrame( animate );

        scene.children.forEach( function( object ) {
          if ( object.geometry instanceof THREE.TorusKnotGeometry ) {
            object.material.transparent = true;
            object.material.opacity = FLICKERING ? Math.random() : 1;
            object.material.wireframe = WIREFRAME;
            object.material.needsUpdate = true;
          }
        });

        // and here..
        controls.update();
        renderer.render( scene, camera );
        
      };
    </script>
  </head>
  <body></body>
</html>
