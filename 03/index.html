<html>

<head>
    <style>
        html,
        body {
            background-color: #000;
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden !important;
        }
    </style>

    <script async src="https://unpkg.com/es-module-shims@1.6.3/dist/es-module-shims.js"></script>

    <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@latest/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@latest/examples/jsm/"
      }
    }
    </script>

    <script type="module">

        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        var renderer, controls, scene, camera;
        var LASTOBJECT;
        var SCALING = false;
        var FLICKERING = false;
        var TORUSES = [];

        window.onload = function () {

            // Three.js code goes here
            scene = new THREE.Scene();

            // setup the camera
            var fov = 75;
            var ratio = window.innerWidth / window.innerHeight;
            var zNear = 1;
            var zFar = 10000;
            camera = new THREE.PerspectiveCamera(fov, ratio, zNear, zFar);
            camera.position.set(0, 0, 100);

            // create renderer and setup the canvas
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);


            //change to onmousedown
            renderer.domElement.onmousedown = function (e) {
                //place torus with shift + left mouse button only
                if (!e.shiftKey || e.button !== 0) {
                    return;
                }
                //turn off camera controlls
                controls.enabled = false;

                console.log('Yay! We clicked!');

                var pixel_coords = new THREE.Vector2(e.clientX, e.clientY);

                console.log('Pixel coords', pixel_coords);

                var vp_coords = new THREE.Vector2(
                    (pixel_coords.x / window.innerWidth) * 2 - 1,  //X
                    -(pixel_coords.y / window.innerHeight) * 2 + 1) // Y

                console.log('Viewport coords', vp_coords);

                var vp_coords_near = new THREE.Vector3(vp_coords.x, vp_coords.y, 0);


                var raycaster = new THREE.Raycaster();
                raycaster.setFromCamera(vp_coords_near, camera);
                var intersects = raycaster.intersectObject(invisible_plane);

                console.log('Ray to Invisible Plane', intersects[0].point);

                // update cube position
                //cube.position.set(intersects[0].point.x, intersects[0].point.y, intersects[0].point.z);
                var geometry = new THREE.TorusKnotGeometry(10, 3, 100, 16);
                var material = new THREE.MeshStandardMaterial({
                    color: 0xFF69B4

                });
                var torus = new THREE.Mesh(geometry, material);
                torus.position.set(
                    intersects[0].point.x,
                    intersects[0].point.y,
                    intersects[0].point.z
                );

                //allow changes to opacity 
                torus.material.transparent = true;
                torus.material.needsUpdate = true;
                //flickering
                scene.add(torus);
                TORUSES.push(torus);

                LASTOBJECT = torus;
                SCALING = true;
            };

            //restore the controls and stop resizing 
            renderer.domElement.onmouseup = function (e) {
                SCALING = false;
                controls.enabled = true;
            };

            //resize the newest torus during the drag
            renderer.domElement.onmousemove = function (e) {
                if (SCALING) {
                    var DELTA = -e.movementY * 0.01;

                    LASTOBJECT.scale.set(
                        LASTOBJECT.scale.x += DELTA,
                        LASTOBJECT.scale.y += DELTA,
                        LASTOBJECT.scale.z += DELTA
                    );


                    //color switch as scale crosses zero
                    if (LASTOBJECT.scale.x < 0) {
                        LASTOBJECT.material.color.set(0x7CFC00);
                    } else if (LASTOBJECT.scale.x > 0) {
                        LASTOBJECT.material.color.set(0xFF69B4);
                    }
                }
            };

            //f key to toggle flickering 
            window.onkeypress = function (e) {
                if (e.key === 'f') {
                    FLICKERING = !FLICKERING;
                }
            };



            // setup lights
            var ambientLight = new THREE.AmbientLight();
            scene.add(ambientLight);

            var light = new THREE.DirectionalLight(0xffffff, 5.0);
            light.position.set(10, 100, 10);
            scene.add(light);

            // configure cube
            //var geometry = new THREE.BoxGeometry(20, 20, 20);
            //var material = new THREE.MeshStandardMaterial({ color: 0xffffff, wireframe: true });

            //var cube = new THREE.Mesh(geometry, material);

            //scene.add(cube);
            //need to replace starting cube with solid torus 
            var geometry = new THREE.TorusKnotGeometry(10, 3, 100, 16);
            var material = new THREE.MeshStandardMaterial({
                color: 0xFF69B4
            });

            var torus = new THREE.Mesh(geometry, material);
            scene.add(torus);

            //include starting torus in flickering
            torus.material.transparent = true;
            torus.material.needsUpdate = true;
            TORUSES.push(torus);



            //
            // The invisible plane
            //
            geometry = new THREE.PlaneGeometry(10000, 10000);
            material = new THREE.MeshBasicMaterial({
                visible: false
            });

            var invisible_plane = new THREE.Mesh(geometry, material);

            scene.add(invisible_plane);
            //
            //
            //



            // interaction
            controls = new OrbitControls(camera, renderer.domElement);

            // call animation/rendering loop
            animate();

        };

        function animate() {

            requestAnimationFrame(animate);

            // and here..
            //change torus opacity 
            //use math.random
            for (var i = 0; i < TORUSES.length; i++) {
                if (FLICKERING) {
                    TORUSES[i].material.opacity = Math.random();
                } else {
                    TORUSES[i].material.opacity = 1;
                }
            }
            controls.update();
            renderer.render(scene, camera);

        };
    </script>
</head>

<body></body>

</html>
