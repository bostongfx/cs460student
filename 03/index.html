<html>

<head>
    <style>
        html,
        body {
            background-color: #000;
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden !important;
        }
    </style>

    <script async src="https://unpkg.com/es-module-shims@1.6.3/dist/es-module-shims.js"></script>

    <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@latest/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@latest/examples/jsm/"
      }
    }
    </script>

    <script type="module">

        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        var renderer, controls, scene, camera, torus;
        var LASTOBJECT = null;
        var isDragging = false;
        var FLICKERING = false;
        var WIREFRAME = false;
        var toruses = [];

        var COLOR_PAIRS = [
            { pos: 0x8a2be2, neg: 0x00ffff }, // purple + cyan
            { pos: 0x1e90ff, neg: 0xffa500 }, // blue + orange
            { pos: 0xff2222, neg: 0xffd700 }, // red + gold
            { pos: 0xff69b4, neg: 0x7cfc00 }  // hotpink + grassgreen
        ];
        var colorIndex = 0;

        window.onload = function () {

            // Three.js code goes here
            scene = new THREE.Scene();

            // setup the camera
            var fov = 75;
            var ratio = window.innerWidth / window.innerHeight;
            var zNear = 1;
            var zFar = 10000;
            camera = new THREE.PerspectiveCamera(fov, ratio, zNear, zFar);
            camera.position.set(0, 0, 100);

            // create renderer and setup the canvas
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);



            renderer.domElement.onmousedown = function (e) {

                if (!e.shiftKey) {
                    return;
                }

                controls.enabled = false;

                console.log('Yay! We clicked!');

                var pixel_coords = new THREE.Vector2(e.clientX, e.clientY);

                console.log('Pixel coords', pixel_coords);

                var vp_coords = new THREE.Vector2(
                    (pixel_coords.x / window.innerWidth) * 2 - 1,  //X
                    -(pixel_coords.y / window.innerHeight) * 2 + 1) // Y

                console.log('Viewport coords', vp_coords);

                var vp_coords_near = new THREE.Vector3(vp_coords.x, vp_coords.y, 0);


                var raycaster = new THREE.Raycaster();
                raycaster.setFromCamera(vp_coords_near, camera);
                var intersects = raycaster.intersectObject(invisible_plane);

                if (intersects.length > 0) {
                    console.log('Ray to Invisible Plane', intersects[0].point);

                    var pair = COLOR_PAIRS[colorIndex % COLOR_PAIRS.length];
                    colorIndex++;

                    var new_geometry = new THREE.TorusKnotGeometry(10, 3, 100, 16);
                    var new_material = new THREE.MeshStandardMaterial({ color: pair.pos, wireframe: WIREFRAME });
                    torus = new THREE.Mesh(new_geometry, new_material);
                    torus.userData.posColor = pair.pos;
                    torus.userData.negColor = pair.neg;

                    torus.position.set(intersects[0].point.x, intersects[0].point.y, intersects[0].point.z);
                    scene.add(torus);
                    toruses.push(torus);

                    LASTOBJECT = torus;
                    window.LASTOBJECT = LASTOBJECT;
                    isDragging = true;
                }

            };

            renderer.domElement.onmouseup = function (e) {
                controls.enabled = true;
                isDragging = false;
            };

            renderer.domElement.onmousemove = function (e) {

                if (isDragging && LASTOBJECT) {

                    var DELTA = e.movementY;

                    LASTOBJECT.scale.set(
                        LASTOBJECT.scale.x + DELTA,
                        LASTOBJECT.scale.y + DELTA,
                        LASTOBJECT.scale.z + DELTA
                    );

                    var posColor = (LASTOBJECT.userData && LASTOBJECT.userData.posColor) ? LASTOBJECT.userData.posColor : 0xff69b4;
                    var negColor = (LASTOBJECT.userData && LASTOBJECT.userData.negColor) ? LASTOBJECT.userData.negColor : 0x7CFC00;

                    if (LASTOBJECT.scale.x < 0) {
                        LASTOBJECT.material.color.set(negColor);
                    } else {
                        LASTOBJECT.material.color.set(posColor);
                    }

                }

            };


            // setup lights
            var ambientLight = new THREE.AmbientLight();
            scene.add(ambientLight);

            var light = new THREE.DirectionalLight(0xffffff, 5.0);
            light.position.set(10, 100, 10);
            scene.add(light);

            // configure torus knot
            var geometry = new THREE.TorusKnotGeometry(10, 3, 100, 16);
            var initialPair = COLOR_PAIRS[0];
            var material = new THREE.MeshStandardMaterial({ color: initialPair.pos });

            torus = new THREE.Mesh(geometry, material);
            torus.userData.posColor = initialPair.pos;
            torus.userData.negColor = initialPair.neg;

            scene.add(torus);
            toruses.push(torus);



            //
            // The invisible plane
            //
            geometry = new THREE.PlaneGeometry(10000, 10000);
            material = new THREE.MeshBasicMaterial({
                visible: false
            });

            var invisible_plane = new THREE.Mesh(geometry, material);

            scene.add(invisible_plane);
            //
            //
            //



            window.onkeypress = function (e) {

                if (e.key === 'f' || e.key === 'F' || e.code === 'KeyF' || e.keyCode === 102 || e.keyCode === 70) {
                    FLICKERING = !FLICKERING;
                    window.FLICKERING = FLICKERING;
                } else if (e.key === 'w' || e.key === 'W' || e.code === 'KeyW' || e.keyCode === 119 || e.keyCode === 87) {
                    WIREFRAME = !WIREFRAME;
                    window.WIREFRAME = WIREFRAME;
                    for (var i = 0; i < toruses.length; i++) {
                        toruses[i].material.wireframe = WIREFRAME;
                    }
                }

            };

            // interaction
            controls = new OrbitControls(camera, renderer.domElement);

            // call animation/rendering loop
            animate();

        };

        function animate() {

            requestAnimationFrame(animate);

            if (FLICKERING) {
                for (var i = 0; i < toruses.length; i++) {
                    toruses[i].material.transparent = true;
                    toruses[i].material.opacity = Math.random();
                    toruses[i].material.needsUpdate = true;
                }
            } else {
                for (var i = 0; i < toruses.length; i++) {
                    if (toruses[i].material.opacity !== 1.0) {
                        toruses[i].material.opacity = 1.0;
                        toruses[i].material.needsUpdate = true;
                    }
                }
            }

            // and here..
            controls.update();
            renderer.render(scene, camera);

        };
    </script>
</head>

<body></body>

</html>
