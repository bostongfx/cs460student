<html>

<head>
    <style>
        html,
        body {
            background-color: #000;
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden !important;
        }
    </style>

    <script async src="https://unpkg.com/es-module-shims@1.6.3/dist/es-module-shims.js"></script>

    <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@latest/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@latest/examples/jsm/"
      }
    }
    </script>

    <script type="module">

        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        var renderer, controls, scene, camera, LASTOBJECT;
        var isNew = false;
        var flicker = false;
        var wireframe = false;


        window.onload = function () {

            // Three.js code goes here
            scene = new THREE.Scene();

            // setup the camera
            var fov = 75;
            var ratio = window.innerWidth / window.innerHeight;
            var zNear = 1;
            var zFar = 10000;
            camera = new THREE.PerspectiveCamera(fov, ratio, zNear, zFar);
            camera.position.set(0, 0, 100);

            // create renderer and setup the canvas
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            renderer.domElement.onmousedown = function (e) {
                if (e.shiftKey) {
                    controls.enabled = false;

                    console.log('Yay! We clicked!');

                    var pixel_coords = new THREE.Vector2(e.clientX, e.clientY);

                    console.log('Pixel coords', pixel_coords);

                    var vp_coords = new THREE.Vector2(
                        (pixel_coords.x / window.innerWidth) * 2 - 1,  //X
                        -(pixel_coords.y / window.innerHeight) * 2 + 1) // Y

                    console.log('Viewport coords', vp_coords);

                    var vp_coords_near = new THREE.Vector3(vp_coords.x, vp_coords.y, 0);


                    var raycaster = new THREE.Raycaster();
                    raycaster.setFromCamera(vp_coords_near, camera);
                    var intersects = raycaster.intersectObject(invisible_plane);

                    console.log('Ray to Invisible Plane', intersects[0].point);

                    var pink_geometry = new THREE.TorusKnotGeometry(10, 3, 100, 16);
                    var pink_material = new THREE.MeshStandardMaterial({ color: 0xff69b4 });
                    var pink_torus = new THREE.Mesh(pink_geometry, pink_material);

                    // update torus position
                    pink_torus.position.set(intersects[0].point.x, intersects[0].point.y, intersects[0].point.z);
                    scene.add(pink_torus);

                    LASTOBJECT = pink_torus;
                    isNew = true;
                }
            };

            renderer.domElement.onmousemove = function (e) {
                if (isNew) {
                    console.log('We moved!');
                    var DELTA = -e.movementY / 10 // more controlable

                    LASTOBJECT.scale.set(
                        LASTOBJECT.scale.x + DELTA,
                        LASTOBJECT.scale.y + DELTA,
                        LASTOBJECT.scale.z + DELTA
                    );

                    if (LASTOBJECT.scale.x < 0) {
                        LASTOBJECT.material.color.set(0x7CFC00);
                    } else {
                        LASTOBJECT.material.color.set(0xff69b4);
                    }
                }
            };
            renderer.domElement.onmouseup = function (e) {
                controls.enabled = true;
                isNew = false;
            }

            window.onkeypress = function (e) {
                if (e.key == 'f') {
                    flicker = !flicker;
                }
                if (e.key == 'w') {
                    wireframe = !wireframe;
                }
            }

            // setup lights
            var ambientLight = new THREE.AmbientLight();
            scene.add(ambientLight);

            var light = new THREE.DirectionalLight(0xffffff, 5.0);
            light.position.set(10, 100, 10);
            scene.add(light);

            // configure torus
            var geometry = new THREE.TorusKnotGeometry(10, 3, 100, 16);
            var material = new THREE.MeshStandardMaterial({ color: 0xFFFF00 });

            var torus = new THREE.Mesh(geometry, material);

            scene.add(torus);



            //
            // The invisible plane
            //
            geometry = new THREE.PlaneGeometry(10000, 10000);
            material = new THREE.MeshBasicMaterial({
                visible: false
            });

            var invisible_plane = new THREE.Mesh(geometry, material);

            scene.add(invisible_plane);
            //
            //
            //



            // interaction
            controls = new OrbitControls(camera, renderer.domElement);

            // call animation/rendering loop
            animate();

        };

        function animate() {

            requestAnimationFrame(animate);

            // and here..
            controls.update();

            scene.traverse(function (object) {
                if (object.isMesh & flicker) {
                    object.material.opacity = Math.random();
                    object.material.transparent = true;
                    object.material.needsUpdate = true;
                } else if (object.isMesh) {
                    object.material.opacity = 1;
                    object.material.transparent = false;
                    object.material.needsUpdate = true;
                }

                if (object.isMesh & wireframe) {
                    object.material.wireframe = true;
                } else if (object.isMesh) {
                    object.material.wireframe = false;
                }
            });

            renderer.render(scene, camera);

        };
    </script>
</head>

<body></body>

</html>
