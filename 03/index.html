<html>

<head>
    <style>
        html,
        body {
            background-color: #000;
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden !important;
        }
    </style>

    <script async src="https://unpkg.com/es-module-shims@1.6.3/dist/es-module-shims.js"></script>

    <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@latest/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@latest/examples/jsm/"
      }
    }
    </script>

    <script type="module">

        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        var renderer, controls, scene, camera;
        var LASTOBJECT, isScaling = false;
        var FLICKERING = false;
        var WIREFRAME = false;
        var toruses = [];

        window.onkeypress = function (e) {
            if (e.key.toLowerCase() === 'w') {
                WIREFRAME = !WIREFRAME;
                toruses.forEach(function (torus) {
                    torus.material.wireframe = WIREFRAME;
                });
                return;
            }

            if (e.key.toLowerCase() !== 'f') return;

            FLICKERING = !FLICKERING;

            if (!FLICKERING) {
                toruses.forEach(function (torus) {
                    torus.material.opacity = 1;
                });
            }
        };

        window.onload = function () {

            // Three.js code goes here
            scene = new THREE.Scene();

            // setup the camera
            var fov = 75;
            var ratio = window.innerWidth / window.innerHeight;
            var zNear = 1;
            var zFar = 10000;
            camera = new THREE.PerspectiveCamera(fov, ratio, zNear, zFar);
            camera.position.set(0, 0, 45);

            // create renderer and setup the canvas
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);



            renderer.domElement.addEventListener('pointerdown', function (e) {
                controls.enabled = !(e.shiftKey && e.button === 0);
            }, true);

            renderer.domElement.onmouseup = function () {
                controls.enabled = true;
                isScaling = false;
            };

            renderer.domElement.onmousemove = function (e) {
                if (!isScaling || !LASTOBJECT) return;

                console.log('movementY', e.movementY);

                var DELTA = -e.movementY * 0.01;
                LASTOBJECT.scale.set(
                    LASTOBJECT.scale.x + DELTA,
                    LASTOBJECT.scale.y + DELTA,
                    LASTOBJECT.scale.z + DELTA
                );
                LASTOBJECT.material.color.set(
                    LASTOBJECT.scale.x < 0 ? 0x7cfc00 : 0xff69b4
                );
            };

            window.addEventListener('mouseup', function () {
                controls.enabled = true;
                isScaling = false;
            });

            renderer.domElement.onmousedown = function (e) {

                if (!e.shiftKey || e.button !== 0) return;

                controls.enabled = false;

                console.log('Yay! We clicked!');

                var pixel_coords = new THREE.Vector2(e.clientX, e.clientY);

                console.log('Pixel coords', pixel_coords);

                var vp_coords = new THREE.Vector2(
                    (pixel_coords.x / window.innerWidth) * 2 - 1,  //X
                    -(pixel_coords.y / window.innerHeight) * 2 + 1) // Y

                console.log('Viewport coords', vp_coords);

                var vp_coords_near = new THREE.Vector3(vp_coords.x, vp_coords.y, 0);


                var raycaster = new THREE.Raycaster();
                raycaster.setFromCamera(vp_coords_near, camera);
                var intersects = raycaster.intersectObject(invisible_plane);

                if (intersects.length === 0) return;

                console.log('Ray to Invisible Plane', intersects[0].point);

                var newTorus = new THREE.Mesh(
                    torus.geometry,
                    new THREE.MeshStandardMaterial({ color: 0xff69b4, wireframe: WIREFRAME })
                );
                newTorus.rotation.copy(torus.rotation);
                newTorus.position.copy(intersects[0].point);
                scene.add(newTorus);
                toruses.push(newTorus);
                LASTOBJECT = newTorus;
                isScaling = true;

            };


            // setup lights
            var ambientLight = new THREE.AmbientLight(0xffffff, 0.3);
            scene.add(ambientLight);

            var light = new THREE.DirectionalLight(0xffffff, 2.0);
            light.position.set(30, 40, 60);
            scene.add(light);

            var geometry = new THREE.TorusKnotGeometry(10, 3, 128, 24, 2, 3);
            var material = new THREE.MeshStandardMaterial({ color: 0xff0000, wireframe: WIREFRAME });

            var torus = new THREE.Mesh(geometry, material);
            torus.rotation.set(Math.PI / 4, Math.PI / 6, 0);

            scene.add(torus);
            toruses.push(torus);



            //
            // The invisible plane
            //
            geometry = new THREE.PlaneGeometry(10000, 10000);
            material = new THREE.MeshBasicMaterial({
                visible: false
            });

            var invisible_plane = new THREE.Mesh(geometry, material);

            scene.add(invisible_plane);
            //
            //
            //



            // interaction
            controls = new OrbitControls(camera, renderer.domElement);

            // call animation/rendering loop
            animate();

        };

        function animate() {

            requestAnimationFrame(animate);

            if (FLICKERING) {
                toruses.forEach(function (torus) {
                    torus.material.opacity = Math.random();
                    if (!torus.material.transparent) {
                        torus.material.transparent = true;
                        torus.material.needsUpdate = true;
                    }
                });
            }

            // and here..
            controls.update();
            renderer.render(scene, camera);

        };
    </script>
</head>

<body></body>

</html>
