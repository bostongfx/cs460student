<html>

<head>
    <style>
        html,
        body {
            background-color: #000;
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden !important;
        }
    </style>

    <script async src="https://unpkg.com/es-module-shims@1.6.3/dist/es-module-shims.js"></script>

    <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@latest/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@latest/examples/jsm/"
      }
    }
    </script>

    <script type="module">

        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        var renderer, controls, scene, camera;

        var LASTOBJECT = null;
        var DRAGGING = false;
        var TORUSES = [];
        var FLICKERING = false;
        var WIREFRAME = false;

        window.onload = function () {

            // Three.js code goes here
            scene = new THREE.Scene();

            // setup the camera
            var fov = 75;
            var ratio = window.innerWidth / window.innerHeight;
            var zNear = 1;
            var zFar = 10000;
            camera = new THREE.PerspectiveCamera(fov, ratio, zNear, zFar);
            camera.position.set(0, 0, 100);

            // create renderer and setup the canvas
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);



            renderer.domElement.onmousedown = function (e) {
                if (!e.shiftKey) return;
                controls.enabled = false;

                console.log('Yay! We clicked!');

                var pixel_coords = new THREE.Vector2(e.clientX, e.clientY);

                console.log('Pixel coords', pixel_coords);

                var vp_coords = new THREE.Vector2(
                    (pixel_coords.x / window.innerWidth) * 2 - 1,  //X
                    -(pixel_coords.y / window.innerHeight) * 2 + 1) // Y

                console.log('Viewport coords', vp_coords);

                var vp_coords_near = new THREE.Vector3(vp_coords.x, vp_coords.y, 0);


                var raycaster = new THREE.Raycaster();
                raycaster.setFromCamera(vp_coords_near, camera);
                var intersects = raycaster.intersectObject(invisible_plane);

                console.log('Ray to Invisible Plane', intersects[0].point);

                //placing a new pink torus
                var geometry = new THREE.TorusKnotGeometry(10, 3, 64, 8);
                var material = new THREE.MeshStandardMaterial({ color: 0xff69b4 });
                var torus = new THREE.Mesh(geometry, material);
                torus.position.set(intersects[0].point.x, intersects[0].point.y, intersects[0].point.z);
                TORUSES.push(torus);
                scene.add(torus);
                LASTOBJECT = torus;
                DRAGGING = true;
            };

            renderer.domElement.onmousemove = function (e) {
                if (!DRAGGING || !LASTOBJECT) return;
                var DELTA = -e.movementY * 0.02;
                var torus = LASTOBJECT;
                torus.scale.set(torus.scale.x + DELTA, torus.scale.y + DELTA, torus.scale.z + DELTA);
                if (torus.scale.x < 0) {
                    torus.material.color.set(0x7cfc00);
                } else {
                    torus.material.color.set(0xff69b4);
                }
            };

            renderer.domElement.onmouseup = function (e) {
                controls.enabled = true;
                DRAGGING = false;
            };

            window.onkeypress = function (e) {
                if (e.key == 'f') {
                    FLICKERING = !FLICKERING;
                    for (var i = 0; i < TORUSES.length; i++) {
                        TORUSES[i].material.transparent = FLICKERING;
                        TORUSES[i].material.opacity = 1;
                        TORUSES[i].material.needsUpdate = true;
                    }
                }
                if (e.key == 'w') {
                    WIREFRAME = !WIREFRAME;
                    for (var i = 0; i < TORUSES.length; i++) {
                        TORUSES[i].material.wireframe = WIREFRAME;
                    }
                    console.log('Number of toruses:', TORUSES.length);
                }
            };

            // setup lights
            var ambientLight = new THREE.AmbientLight();
            scene.add(ambientLight);

            var light = new THREE.DirectionalLight(0xffffff, 5.0);
            light.position.set(10, 100, 10);
            scene.add(light);

            // configure cube
            var geometry = new THREE.TorusKnotGeometry(10, 3, 64, 8);
            var material = new THREE.MeshStandardMaterial({ color: 0xffff00 });

            var cube = new THREE.Mesh(geometry, material);

            scene.add(cube);



            //
            // The invisible plane
            //
            geometry = new THREE.PlaneGeometry(10000, 10000);
            material = new THREE.MeshBasicMaterial({
                visible: false
            });

            var invisible_plane = new THREE.Mesh(geometry, material);

            scene.add(invisible_plane);
            //
            //
            //



            // interaction
            controls = new OrbitControls(camera, renderer.domElement);

            // call animation/rendering loop
            animate();

        };

        function animate() {

            requestAnimationFrame(animate);

            // and here..
            if (FLICKERING) {
                for (var i = 0; i < TORUSES.length; i++) {
                    TORUSES[i].material.opacity = Math.random();
                }
            }
            controls.update();
            renderer.render(scene, camera);

        };
    </script>
</head>

<body></body>

</html>
