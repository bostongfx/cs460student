<!DOCTYPE html>
<html>
  <head>
    <title>Hello Torus Knot – Three.js</title>
    <style>
      html, body {
        background-color: #000;
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden !important;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script>
      // The most recently placed torus knot, and whether it's being scaled right now
      let LASTOBJECT = null;
      let IS_SCALING = false;

      // All torus knots in the scene, and whether they're flickering (toggled with the f key)
      const TORUSES = [];
      let FLICKERING = false;

      // Whether the torus knots are drawn as wireframes (toggled with the w key)
      let WIREFRAME = false;

      window.onload = function() {
        // Create the scene, camera, and renderer
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 3);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Add interactive camera controls (rotate, zoom, pan)
        const controls = new THREE.OrbitControls(camera, renderer.domElement);

        // Create the light pink torus knot
        const geometry = new THREE.TorusKnotGeometry(0.6, 0.2, 128, 16);
        const material = new THREE.MeshStandardMaterial({ color: 0xffb6c1 });
        const torusKnot = new THREE.Mesh(geometry, material);
        scene.add(torusKnot);
        TORUSES.push(torusKnot);

        // Add lights so the torus knot's 3D shape is visible
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(5, 10, 7.5);
        scene.add(directionalLight);

        // SHIFT+click places a new hotpink torus knot where the mouse is
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        const plane = new THREE.Plane();
        const HOTPINK = 0xff69b4;
        const GRASSGREEN = 0x7cfc00;

        renderer.domElement.onpointerdown = function(e) {
          if (!e.shiftKey) return;

          // Turn off the camera controls so the click doesn't rotate the scene
          controls.enabled = false;

          // Convert the mouse position to normalized device coordinates (-1 to 1)
          mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
          mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

          // Intersect the mouse ray with a plane through the orbit target, facing the camera
          const normal = new THREE.Vector3();
          camera.getWorldDirection(normal);
          plane.setFromNormalAndCoplanarPoint(normal, controls.target);

          raycaster.setFromCamera(mouse, camera);
          const point = new THREE.Vector3();
          if (raycaster.ray.intersectPlane(plane, point)) {
            // Each knot gets its own material so changing its color doesn't recolor the others
            const newMaterial = new THREE.MeshStandardMaterial({ color: HOTPINK, wireframe: WIREFRAME });
            const newTorusKnot = new THREE.Mesh(geometry, newMaterial);
            newTorusKnot.position.copy(point);
            scene.add(newTorusKnot);
            TORUSES.push(newTorusKnot);

            // Remember it so dragging can scale it until the mouse is released
            LASTOBJECT = newTorusKnot;
            IS_SCALING = true;
          }
        };

        // While the mouse is held after placing, drag up to grow and down to shrink
        renderer.domElement.onpointermove = function(e) {
          if (!IS_SCALING) return;

          console.log('movementY', e.movementY);

          // movementY is negative when dragging up, so flip it
          const DELTA = -e.movementY * 0.01;
          LASTOBJECT.scale.set(LASTOBJECT.scale.x + DELTA,
                               LASTOBJECT.scale.y + DELTA,
                               LASTOBJECT.scale.z + DELTA);

          // A negative scale means the knot has flipped: green when flipped, pink otherwise
          if (LASTOBJECT.scale.x < 0) {
            LASTOBJECT.material.color.set(GRASSGREEN);
          } else {
            LASTOBJECT.material.color.set(HOTPINK);
          }
        };

        // Turn the camera controls back on and stop scaling when the mouse is released
        renderer.domElement.onpointerup = function() {
          controls.enabled = true;
          IS_SCALING = false;
        };

        // Press f to start flickering, press it again to stop
        // Press w to switch between wireframe and solid
        window.onkeypress = function(e) {
          if (e.key === 'w' || e.key === 'W') {
            WIREFRAME = !WIREFRAME;
            for (const torus of TORUSES) {
              torus.material.wireframe = WIREFRAME;
            }
            return;
          }

          if (e.key !== 'f' && e.key !== 'F') return;

          FLICKERING = !FLICKERING;

          // When stopping, make every torus fully solid again
          if (!FLICKERING) {
            for (const torus of TORUSES) {
              torus.material.opacity = 1;
              torus.material.transparent = false;
              torus.material.needsUpdate = true;
            }
          }
        };

        // Handle window resizing
        window.addEventListener('resize', function() {
          camera.aspect = window.innerWidth / window.innerHeight;
          camera.updateProjectionMatrix();
          renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Render loop
        function animate() {
          requestAnimationFrame(animate);
          controls.update();

          // Give every torus a random opacity each frame while flickering
          if (FLICKERING) {
            for (const torus of TORUSES) {
              torus.material.opacity = Math.random();
              torus.material.transparent = true;
              torus.material.needsUpdate = true;
            }
          }

          renderer.render(scene, camera);
        }
        animate();
      };
    </script>
  </head>
  <body>
  </body>
</html>
