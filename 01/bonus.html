<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Three.js WebGL - Hello Cube</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0f172a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #f8fafc;
    }
    #info {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 10;
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(8px);
      padding: 12px 18px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
      pointer-events: none;
    }
    #info h1 { margin: 0 0 4px 0; font-size: 16px; font-weight: 600; }
    #info p { margin: 0; font-size: 12px; color: #94a3b8; }
    canvas { display: block; }
  </style>

  <!-- Import map so `three` and `three/addons/...` resolve to the CDN ES modules -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="info">
    <h1>Three.js Interactive Hello Cube</h1>
    <p>Left-click drag: Rotate | Right-click drag: Pan | Scroll: Zoom</p>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // 1. Create the scene with the same dark navy background
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0f172a);

    // 2. Create a perspective camera and pull it back from the origin
    const camera = new THREE.PerspectiveCamera(
      50, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(2.5, 2, 3.5);

    // 3. Create and initialize the WebGL renderer, fill the viewport
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // 4. Create a cube, sky blue (matches XTK's [0.3, 0.6, 1.0])
    const geometry = new THREE.BoxGeometry(1.5, 1.5, 1.5);
    const material = new THREE.MeshPhongMaterial({
      color: new THREE.Color(0.3, 0.6, 1.0),
      shininess: 30
    });
    const cube = new THREE.Mesh(geometry, material);
    scene.add(cube);

    // 5. Light the scene so the cube faces read as distinctly shaded
    const hemiLight = new THREE.HemisphereLight(0xffffff, 0x1e293b, 1.0);
    scene.add(hemiLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 2.0);
    dirLight.position.set(5, 8, 6);
    scene.add(dirLight);

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.3);
    scene.add(ambientLight);

    // 6. OrbitControls: left-drag rotates, right-drag pans, scroll zooms
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.target.set(0, 0, 0);
    controls.update();

    // Don't pop the browser context menu on right-drag pan
    renderer.domElement.addEventListener('contextmenu', (e) => e.preventDefault());

    // 7. Keep camera aspect and renderer size in sync with the window
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // 8. Render loop
    function animate() {
      requestAnimationFrame(animate);
      controls.update(); // required while damping is enabled
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
