<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Hello Cube - Three.js</title>
    <style>
      html, body {
        background-color: #000;
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
      }
    </style>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/TrackballControls.js"></script>
    <script type="text/javascript">
      window.onload = function() {
        // create scene, camera, and renderer
        var scene = new THREE.Scene();
        var camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 1, 1000);
        camera.position.set(0, 0, 80);

        var renderer = new THREE.WebGLRenderer();
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // create a cube primitive (defaults: center [0,0,0], size 20, color white)
        var geometry = new THREE.BoxGeometry(20, 20, 20);
        var material = new THREE.MeshStandardMaterial({ color: 0xffffff });
        var cube = new THREE.Mesh(geometry, material);
        scene.add(cube);

        // add lighting
        var light = new THREE.DirectionalLight(0xffffff, 1);
        light.position.set(10, 20, 50);
        scene.add(light);
        scene.add(new THREE.AmbientLight(0x222222));

        // add controls and render the scene
        var controls = new THREE.TrackballControls(camera, renderer.domElement);

        function animate() {
          requestAnimationFrame(animate);
          controls.update();
          renderer.render(scene, camera);
        }
        animate();
      };
    </script>
  </head>
  <body>
  </body>
</html>
