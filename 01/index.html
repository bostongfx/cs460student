<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>CS460 Assignment 1 - Hello Cube</title>
    <style>
      html, body {
        background-color: #000;
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
      }
    </style>
    <script type="text/javascript" src="https://get.goXTK.com/xtk_edge.js"></script>
    <script type="text/javascript">
      window.onload = function() {
        // Create and initialize 3D renderer
        var r = new X.renderer3D();
        r.init();

        // Create a cube
        var c = new X.cube();

        // Add the cube and render
        r.add(c);
        r.render();
      };
    </script>
  </head>
  <body>
  </body>
</html>
