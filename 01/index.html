<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Hello Cube - XTK</title>
    <style>
      html, body {
        background-color: #000;
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
      }
    </style>
    <script type="text/javascript" src="https://get.goXTK.com/xtk_edge.js"></script>
    <script type="text/javascript">
      window.onload = function() {
        // create and initialize a 3D WebGL renderer
        var r = new X.renderer3D();
        r.init();

        // create a cube primitive (defaults: center [0,0,0], size 20, color white)
        var cube = new X.cube();

        // add cube to renderer and render the scene
        r.add(cube);
        r.render();
      };
    </script>
  </head>
  <body>
  </body>
</html>
